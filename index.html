// Option Shuffling with Anchored/Pinned Options & Shuffle-Safe Enforcement
// Normalize MCQ/TF/free-response data and map displayed options back to source answers when choices apply.
function prepareQuestionForDisplay(rawQ) {
  const vRec = V[qk(rawQ)];
  const variant = (vRec && vRec._variant) ? vRec._variant : rawQ._variant;
  const useOrig = (vRec && vRec._useOriginal != null) ? vRec._useOriginal : rawQ._useOriginal;
  const activeSource = (variant && !useOrig) ? variant : rawQ;

  const qType = (rawQ.qType || rawQ.type || activeSource.qType || activeSource.type || 'mcq').toString().toLowerCase();
  if (qType === 'tf') {
    const tfOpts = activeSource.tfOptions || activeSource.trueFalseOptions || ['True', 'False'];
    const tfAns = activeSource.tfAnswer !== undefined ? activeSource.tfAnswer : activeSource.a;
    return {
      ...rawQ,
      q: activeSource.q,
      code: activeSource.code,
      e: activeSource.e,
      qType: 'tf',
      expectedAnswer: activeSource.expectedAnswer || activeSource.answerText,
      origQ: rawQ,
      origO: tfOpts.slice(),
      origA: tfAns,
      displayOpts: tfOpts.slice(),
      displayA: tfAns,
      isShowingVariant: !!(variant && !useOrig)
    };
  }
  if (qType === 'fr' || qType === 'free' || qType === 'free_response' || qType === 'written') {
    return {
      ...rawQ,
      q: activeSource.q,
      code: activeSource.code,
      e: activeSource.e,
      qType: 'fr',
      expectedAnswer: activeSource.expectedAnswer || activeSource.answerText || activeSource.ans || activeSource.answer,
      origQ: rawQ,
      origO: [],
      origA: 0,
      displayOpts: [],
      displayA: 0,
      isShowingVariant: !!(variant && !useOrig)
    };
  }

  const origOpts = (activeSource.o || []).slice();
  const rawAnsIndex = activeSource.a !== undefined ? activeSource.a : 0;
  const correctText = origOpts[rawAnsIndex];

  // If shuffle_safe === false, DO NOT SHUFFLE OPTIONS (keeps order intact)
  // Mock exams NEVER shuffle options (preserves standard A, B, C, D entrance exam order and prevents back/forward/resume scrambling)
  if (MK || rawQ.shuffle_safe === false || activeSource.shuffle_safe === false) {
    return {
      ...rawQ,
      q: activeSource.q,
      code: activeSource.code,
      e: activeSource.e,
      origQ: rawQ,
      origO: origOpts,
      origA: rawAnsIndex,
      displayOpts: origOpts.slice(),
      displayA: rawAnsIndex,
      isShowingVariant: !!(variant && !useOrig)
    };
  }

  const isPinned = origOpts.map(opt => {
    const s = String(opt || '').trim().toLowerCase();
    return /^(all\s+of\s+the\s+above|none\s+of\s+the\s+above|both\s+[\(]?[a-d][\)]?\s*(and|&)\s*[\(]?[a-d][\)]?|all\s+these|none\s+these|all\s+of\s+these|none\s+of\s+these)/i.test(s);
  });

  const unpinnedIndices = [];
  origOpts.forEach((opt, idx) => {
    if (!isPinned[idx]) unpinnedIndices.push(idx);
  });

  const shuffledUnpinned = unpinnedIndices.slice().sort(() => Math.random() - 0.5);

  const displayOpts = new Array(origOpts.length);
  let ptr = 0;
  for (let i = 0; i < origOpts.length; i++) {
    if (isPinned[i]) {
      displayOpts[i] = origOpts[i];
    } else {
      displayOpts[i] = origOpts[shuffledUnpinned[ptr++]];
    }
  }

  const displayA = displayOpts.findIndex(opt => opt === correctText);

  return {
    ...rawQ,
    q: activeSource.q,
    code: activeSource.code,
    e: activeSource.e,
    origQ: rawQ,
    origO: origOpts,
    origA: rawAnsIndex,
    displayOpts,
    displayA: displayA >= 0 ? displayA : 0,
    isShowingVariant: !!(variant && !useOrig)
  };
}

// Probabilistic Spaced Session Construction (FSRS-scheduled, unbroken subject runs)
// Compose a session from due reviews, weak subjects, and coverage without repeating today's questions.
function buildTodaySession(minutes = 15, quickOnly = false) {
  const allBank = bankQuestionPool().filter(q => normalSessionEligible(q));
  if (!allBank.length && (!D || !D.length)) return [];
  const targetQ = Math.max(10, Math.round(minutes * 60 / 50));
  const basePool = quickOnly ? allBank.filter(q => effQuick(q)) : allBank;
  if (!basePool.length) return [];

  // Exclude practice questions already completed today. Mock attempts do not
  // consume the day's practice pool, and legacy records without a timestamp are ignored.
  const doneTodayKeys = questionsAnsweredToday();

  const isAvailableToday = q => {
    if (!q) return false;
    const uid = questionUid(q) || qk(q);
    const k = qk(q);
    return !doneTodayKeys.has(uid) && !doneTodayKeys.has(k);
  };

  const pool = preferredPracticeQuestions(basePool.filter(isAvailableToday));
  if (!pool.length) return [];

  const due = dueKeys(quickOnly, true).filter(candidateKey => {
    const q = byN(candidateKey);
    return q && isAvailableToday(q);
  });
  const latestPractice = latestPracticeRecordMap();

  const weakSubjects = new Set(
    milestoneSubjectSignals().filter(s => s.isWeak).map(s => s.k)
  );
  const coverageSnapshot = calculateUnitCoverage();
  const coverageReserve = Math.min(targetQ - 1, Math.max(4, Math.round(targetQ * 0.4)));
  const weakCap = Math.max(2, Math.round(targetQ * 0.2));
  const struggleCap = Math.max(2, Math.round(targetQ * 0.15));
  const dueCap = Math.max(1, targetQ - coverageReserve - weakCap - struggleCap);
  const dueIdentities = new Set(due.map(key => {
    const q = byN(key);
    return q ? (questionUid(q) || qk(q)) : null;
  }).filter(Boolean));

  const session = [];
  const addedIdentities = new Set();
  function add(itemOrKey) {
    if (itemOrKey == null) return false;
    const q = typeof itemOrKey === 'object' ? itemOrKey : byN(itemOrKey);
    const identity = q ? (questionUid(q) || qk(q)) : String(itemOrKey);
    if (addedIdentities.has(identity)) return false;
    addedIdentities.add(identity);
    session.push(identity);
    return true;
  }

  // Due items (priority-sorted from dueKeys, max 3 leeches per session)
  let leechCountInSession = 0;
  let dueAdded = 0;
  for (const candidateKey of due) {
    if (dueAdded >= dueCap) break;
    const candQ = byN(candidateKey);
    const v = candQ ? V[qk(candQ)] : null;
    const isLeech = v && v.missCount >= 3;
    if (isLeech) {
      if (leechCountInSession >= 3) continue;
      leechCountInSession++;
    }
    if (add(candidateKey)) dueAdded++;
  }

  if (weakSubjects.size > 0) {
    const weakPool = pool.filter(q => {
      if (!weakSubjects.has(cl(q.s)) || (effLevel(q) !== 0 && effLevel(q) !== 1)) return false;
      const last = latestPracticeRecordFor(q, latestPractice);
      return !last || !last.ok || (last.cf != null && last.cf < 3);
    });
    weakPool.sort((a, b) => {
      const aLast = latestPracticeRecordFor(a, latestPractice);
      const bLast = latestPracticeRecordFor(b, latestPractice);
      const aStruggle = aLast && (!aLast.ok || (aLast.cf != null && aLast.cf < 3)) ? 0 : 1;
      const bStruggle = bLast && (!bLast.ok || (bLast.cf != null && bLast.cf < 3)) ? 0 : 1;
      return aStruggle - bStruggle || (effLevel(a) - effLevel(b)) || (Math.random() - 0.5);
    });
    let weakAdded = 0;
    for (const q of weakPool) {
      if (weakAdded >= weakCap || session.length >= targetQ - coverageReserve) break;
      if (add(q)) weakAdded++;
    }
  }

  const strugglePool = pool.filter(q => {
    const identity = questionUid(q) || qk(q);
    if (dueIdentities.has(identity)) return false;
    const last = latestPracticeRecordFor(q, latestPractice);
    return !!last && (!last.ok || (last.cf != null && last.cf < 3));
  });
  strugglePool.sort((a, b) => {
    const aLast = latestPracticeRecordFor(a, latestPractice);
    const bLast = latestPracticeRecordFor(b, latestPractice);
    const aWrong = aLast && !aLast.ok ? 0 : 1;
    const bWrong = bLast && !bLast.ok ? 0 : 1;
    return aWrong - bWrong ||
      ((aLast && aLast.cf != null ? aLast.cf : 3) - (bLast && bLast.cf != null ? bLast.cf : 3)) ||
      ((bLast && bLast.t) || 0) - ((aLast && aLast.t) || 0);
  });
  let struggleAdded = 0;
  for (const q of strugglePool) {
    if (struggleAdded >= struggleCap || session.length >= targetQ - coverageReserve) break;
    if (add(q)) struggleAdded++;
  }

  // Prefer unseen questions for coverage before using previously mastered, non-due items.
  const coveragePool = pool.filter(q => !addedIdentities.has(questionUid(q) || qk(q)));
  const coverageSlots = Math.min(coverageReserve, targetQ - session.length);
  const unseenCoveragePool = coveragePool.filter(q => !hasPracticeAttempt(q, latestPractice));
  const coveragePicks = pickCoverageQuestions(unseenCoveragePool, coverageSlots, coverageSnapshot, {
    maxPerUnit: 1,
    exclude: addedIdentities
  });
  coveragePicks.forEach(q => add(q));

  // If the pool is exhausted, prefer the longest-unseen review rather than a recent mastered item.
  const remainingAll = pool.filter(q => !addedIdentities.has(questionUid(q) || qk(q)));
  remainingAll.sort((a, b) => {
    const aDue = dueIdentities.has(questionUid(a) || qk(a)) ? 0 : 1;
    const bDue = dueIdentities.has(questionUid(b) || qk(b)) ? 0 : 1;
    if (aDue !== bDue) return aDue - bDue;
    const aLast = latestPracticeRecordFor(a, latestPractice);
    const bLast = latestPracticeRecordFor(b, latestPractice);
    const aUnseen = aLast ? 1 : 0;
    const bUnseen = bLast ? 1 : 0;
    if (aUnseen !== bUnseen) return aUnseen - bUnseen;
    if (aLast && bLast && aLast.t !== bLast.t) return (aLast.t || 0) - (bLast.t || 0);
    return (effLevel(a) - effLevel(b)) || (Math.random() - 0.5);
  });
  for (const q of remainingAll) {
    if (session.length >= targetQ) break;
    add(q);
  }

  return groupQuestionBlocks(session);
}

// Honest Readiness Meter
function agg() {
  const m = {}, add = (k, c, w, x) => {
    const canonKey = canonSubj(k);
    const o = m[canonKey] || (m[canonKey] = { c: 0, w: 0, k: 0, h: [] });
    o.c += c; o.w += w; o.k += x;
    if (c + w + x) o.h.push(c / (c + w + x));
  };
  A.forEach(a => Object.entries(a.subj || {}).forEach(([k, v]) => add(k, v[0], v[1], v[2])));
  const cur = {};
  (D || []).forEach(q => {
    const k = canonSubj(q.s), v = cur[k] || (cur[k] = [0, 0, 0]), r = R[q.n];
    if (r === 'c') v[0]++;
    else if (r === 'w') v[1]++;
    else if (r === 's') v[2]++;
  });
  Object.entries(cur).forEach(([k, v]) => add(k, ...v));

  // Non-destructive Attempt Recovery:
  // If historical attempts in A were truncated by older cloud-sync deduplication,
  // reconcile with the immutable question-level log L so the user's authentic attempt progress is restored!
  if (Array.isArray(L) && L.length > 0) {
    const logCounts = {};
    L.forEach(item => {
      if (!item || !item.s) return;
      const ck = canonSubj(item.s);
      const entry = logCounts[ck] || (logCounts[ck] = { c: 0, w: 0, k: 0 });
      if (item.ok) entry.c++;
      else if (item.ch === -1) entry.k++;
      else entry.w++;
    });
    Object.entries(logCounts).forEach(([subjKey, lc]) => {
      const o = m[subjKey] || (m[subjKey] = { c: 0, w: 0, k: 0, h: [] });
      const currentTot = o.c + o.w + o.k;
      const logTot = lc.c + lc.w + lc.k;
      if (logTot > currentTot) {
        o.c = lc.c;
        o.w = lc.w;
        o.k = lc.k;
      }
    });
  }

  return m;
}

function subjectTier(subject) {
  const c = canonSubj(subject);
  if (TIER_A_SUBJECTS.has(c)) return 'A';
  if (TIER_B_SUBJECTS.has(c)) return 'B';
  return 'C';
}

function subjectTarget(subject) {
  const t = subjectTier(subject);
  if (t === 'A') return 0.85;
  if (t === 'B') return 0.80;
  return 0.75;
}

function isProvisionalSubject(subject) {
  return subjectTier(subject) === 'C';
}

function firstPracticeAttempts() {
  const map = new Map();
  (L || []).forEach(rec => {
    if (!rec || rec.mock === 1 || recordIsOutOfScope(rec)) return;
    const key = recordIdentity(rec);
    if (!key) return;
    const prev = map.get(key);
    if (!prev || (rec.t || 0) < (prev.t || 0)) map.set(key, rec);
  });
  return [...map.values()];
}

function scoreRecords(records) {
  const scoredRecords = records.filter(rec => rec && !recordIsOutOfScope(rec));
  const attempts = scoredRecords.length;
  const weightedAttempts = scoredRecords.reduce((sum, rec) => sum + recordDifficultyWeight(rec), 0);
  let points = 0;
  scoredRecords.forEach(rec => { points += recordPointValue(rec); });
  const score = weightedAttempts ? (points + 7.5) / (weightedAttempts + 10) : 0;
  return {
    attempts,
    weightedAttempts,
    points,
    score,
    raw: rawAccuracy(scoredRecords),
    provisional: weightedAttempts < 15
  };
}

function rawAccuracy(records) {
  const scoredRecords = (records || []).filter(rec => rec && !recordIsOutOfScope(rec));
  if (!scoredRecords.length) return 0;
  let ok = 0;
  scoredRecords.forEach(rec => { if (rec.ok) ok++; });
  return ok / scoredRecords.length;
}

// Estimate readiness from first practice attempts; mock results and repeated attempts are handled separately.
function readinessStats() {
  const first = firstPracticeAttempts();
  const bySubject = {};
  const l0BySubject = {};
  first.forEach(rec => {
    const q = findQuestionByRecord(rec);
    const subject = canonSubj(rec.s || (q && q.s) || '');
    if (!subject) return;
    (bySubject[subject] = bySubject[subject] || []).push(rec);
    const lvl = recordLevelValue(rec);
    if (lvl === 0) (l0BySubject[subject] = l0BySubject[subject] || []).push(rec);
  });

  const subjects = {};
  Object.entries(bySubject).forEach(([subject, records]) => {
    const scored = scoreRecords(records);
    subjects[subject] = {
      ...scored,
      subject,
      target: subjectTarget(subject),
      raw: rawAccuracy(records)
    };
  });

  const l0 = {};
  Object.entries(l0BySubject).forEach(([subject, records]) => {
    const scored = scoreRecords(records);
    l0[subject] = {
      ...scored,
      subject,
      raw: rawAccuracy(records),
      mastered: scored.weightedAttempts >= 5 && scored.raw >= 0.85
    };
  });

  const overall = scoreRecords(first);
  return { overall, subjects, l0, first };
}

function calculateUnitCoverage() {
  const now = Date.now();
  const sevenDays = 7 * 86400000;
  const subjects = {};
  const syllabusSubjects = syllabusSubjectList();
  const subjectDefinitions = syllabusSubjects.length
    ? syllabusSubjects
    : Object.entries(SYLLABUS_UNIT_COUNTS).map(([name, count]) => ({
      name,
      canonicalName: canonSubj(name),
      units: Array.from({ length: count }, (_, index) => ({ name: `Unit ${index + 1}`, topics: [] }))
    }));
  const topicsById = new Map();
  subjectDefinitions.forEach(subjectDefinition => {
    const subject = subjectDefinition.canonicalName || canonSubj(subjectDefinition.name);
    const unitDefinitions = Array.isArray(subjectDefinition.units) ? subjectDefinition.units : [];
    const unitCount = unitDefinitions.length;
    const units = {};
    for (let unit = 1; unit <= unitCount; unit++) {
      const definition = unitDefinitions[unit - 1] || {};
      const topicList = (Array.isArray(definition.topics) ? definition.topics : []).map(topic => {
        const entry = {
          id: String(topic.id),
          subject,
          unit,
          name: String(topic.name),
          level: Number.isInteger(topic.level) ? topic.level : 3,
          importance: Number(topic.importance) || 0,
          weight: Number(topic.global_weight_pct) || 0,
          type: String(topic.type || 'recall'),
          skip: topic.skip === true,
          note: String(topic.note || ''),
          confusableWith: Array.isArray(topic.confusable_with) ? topic.confusable_with : [],
          bankCount: 0,
          attemptCount: 0,
          knownCount: 0,
          knownDays: new Set(),
          recentConf3Miss: false,
          solid: false
        };
        topicsById.set(entry.id, entry);
        return entry;
      });
      units[unit] = {
        subject,
        unit,
        name: String(definition.name || `Unit ${unit}`),
        bankCount: 0,
        touchedCount: 0,
        knownCount: 0,
        knownDays: new Set(),
        recentConf3Miss: false,
        solid: false,
        topicList
      };
    }
    subjects[subject] = { subject, unitCount, units, touchedUnits: 0, solidUnits: 0, bankSupportedUnits: 0 };
  });
  if (!syllabusSubjects.length) MISSING_BANK_UNITS.forEach(item => {
    const subject = subjects[item.subject];
    const unit = subject && subject.units[item.unit];
    if (unit) unit.name = item.name;
  });

  const byUid = new Map();
  const byQk = new Map();
  let unmappedQuestions = 0;
  let unmappedTopicQuestions = 0;
  let mappedTopicQuestions = 0;
  bankQuestionPool().forEach(q => {
    if (!q || typeof q !== 'object') return;
    const uid = questionUid(q);
    if (uid) byUid.set(uid, q);
    if (q.qid) byUid.set(q.qid, q);
    const key = qk(q);
    if (key) byQk.set(key, q);
    if (isQuestionDeleted(q) || isQuestionQuarantined(q)) return;
    const subject = subjects[canonSubj(q.s)];
    const unit = questionScopeUnit(q);
    const topicId = String(q.topic_id || '').trim();
    const topic = topicId && topicsById.get(topicId);
    const topicMatches = !!(topic && subject && topic.subject === subject.subject && topic.unit === unit);
    if (topicMatches) {
      topic.bankCount++;
      mappedTopicQuestions++;
    } else {
      unmappedTopicQuestions++;
    }
    if (!subject || unit == null || unit < 1 || unit > subject.unitCount) {
      unmappedQuestions++;
      return;
    }
    const entry = subject.units[unit];
    entry.bankCount++;
    if (q.unit_name && entry.name === `Unit ${unit}`) entry.name = String(q.unit_name);
  });

  const resolveRecordQuestion = rec => {
    if (!rec) return null;
    return (rec.uid && byUid.get(rec.uid)) || (rec.qid && byUid.get(rec.qid)) || (rec.k && byQk.get(rec.k)) || null;
  };
  const recordUnit = rec => {
    const q = resolveRecordQuestion(rec);
    if (!q) return null;
    const subject = subjects[canonSubj(q.s)];
    const unit = questionScopeUnit(q);
    if (!subject || unit == null || unit < 1 || unit > subject.unitCount) return null;
    return { subject, entry: subject.units[unit], q };
  };

  const latestByIdentity = new Map();
  const latestTopicByIdentity = new Map();
  (L || []).forEach(rec => {
    if (!rec || rec.mock === 1) return;
    const found = recordUnit(rec);
    if (!found) return;
    const identity = questionUid(found.q) || qk(found.q);
    const prev = latestByIdentity.get(identity);
    if (!prev || (rec.t || 0) >= (prev.rec.t || 0)) latestByIdentity.set(identity, { rec, entry: found.entry, q: found.q });
    if (rec.variant !== true) {
      const topic = topicsById.get(String(found.q.topic_id || '').trim());
      if (topic && topic.subject === found.subject.subject && topic.unit === found.entry.unit) {
        const topicPrev = latestTopicByIdentity.get(identity);
        if (!topicPrev || (rec.t || 0) >= (topicPrev.rec.t || 0)) latestTopicByIdentity.set(identity, { rec, topic });
      }
    }
  });
  latestByIdentity.forEach(({ rec, entry, q }) => {
    entry.touchedCount++;
    const conf = rec.cf != null ? rec.cf : (rec.conf != null ? rec.conf : null);
    const skipped = rec.skipped === true || rec.ch === -1;
    const known = rec.ok === true && !skipped && (conf == null || conf >= 2);
    if (known) entry.knownCount++;
  });
  latestTopicByIdentity.forEach(({ rec, topic }) => {
    topic.attemptCount++;
    const conf = rec.cf != null ? rec.cf : (rec.conf != null ? rec.conf : null);
    const skipped = rec.skipped === true || rec.ch === -1;
    if (rec.ok === true && !skipped && conf != null && conf >= 2) {
      topic.knownCount++;
      topic.knownDays.add(localDateKey(rec.t || 0));
    }
  });
  (L || []).forEach(rec => {
    if (!rec || rec.mock === 1) return;
    const conf = rec.cf != null ? rec.cf : (rec.conf != null ? rec.conf : null);
    const skipped = rec.skipped === true || rec.ch === -1;
    const found = recordUnit(rec);
    if (!found) return;
    if (rec.ok === true && !skipped && (conf == null || conf >= 2)) {
      found.entry.knownDays.add(localDateKey(rec.t || 0));
    }
    if (!rec.ok && !skipped && conf === 3 && (now - (rec.t || 0)) < sevenDays) {
      found.entry.recentConf3Miss = true;
      const topic = !rec.variant && topicsById.get(String(found.q.topic_id || '').trim());
      if (topic && topic.subject === found.subject.subject && topic.unit === found.entry.unit) {
        topic.recentConf3Miss = true;
      }
    }
  });

  Object.values(subjects).forEach(subject => {
    Object.values(subject.units).forEach(entry => {
      const threshold = Math.min(2, entry.bankCount);
      entry.solid = entry.bankCount > 0 && entry.knownCount >= threshold && entry.knownDays.size >= 2 && !entry.recentConf3Miss;
      entry.topicList.forEach(topic => {
        topic.solid = topic.bankCount >= 2 && topic.knownCount >= 2 && topic.knownDays.size >= 2 && !topic.recentConf3Miss;
      });
    });
    subject.touchedUnits = Object.values(subject.units).filter(entry => entry.touchedCount > 0).length;
    subject.solidUnits = Object.values(subject.units).filter(entry => entry.solid).length;
    subject.bankSupportedUnits = Object.values(subject.units).filter(entry => entry.bankCount > 0).length;
  });
  const subjectList = Object.values(subjects);
  const missingBankUnits = [];
  subjectList.forEach(subject => {
    Object.values(subject.units).forEach(entry => {
      if (entry.bankCount === 0) missingBankUnits.push({ subject: subject.subject, unit: entry.unit, name: entry.name });
    });
  });
  return {
    subjects,
    subjectList,
    totalUnits: Object.values(subjects).reduce((sum, subject) => sum + subject.unitCount, 0),
    totalTopics: topicsById.size,
    taggedTopics: [...topicsById.values()].filter(topic => topic.bankCount > 0).length,
    touchedTopics: [...topicsById.values()].filter(topic => topic.attemptCount > 0).length,
    solidTopics: [...topicsById.values()].filter(topic => topic.solid).length,
    mappedTopicQuestions,
    unmappedTopicQuestions,
    topics: topicsById,
    touchedUnits: subjectList.reduce((sum, subject) => sum + subject.touchedUnits, 0),
    solidUnits: subjectList.reduce((sum, subject) => sum + subject.solidUnits, 0),
    bankSupportedUnits: subjectList.reduce((sum, subject) => sum + subject.bankSupportedUnits, 0),
    missingBankUnits,
    unmappedQuestions
  };
}

function getSyllabusStudyRecommendations(snapshot, limit = 6) {
  if (!snapshot || !snapshot.topics) return [];
  const availableTopics = [...snapshot.topics.values()].filter(topic => {
    const unit = snapshot.subjects[topic.subject] && snapshot.subjects[topic.subject].units[topic.unit];
    return topic.bankCount > 0 || (unit && unit.bankCount > 0);
  });
  const priorityRank = topic => {
    if (topic.recentConf3Miss) return 0;
    if (topic.bankCount && topic.attemptCount && !topic.solid) return 1;
    if (topic.bankCount && !topic.attemptCount) return 2;
    const unit = snapshot.subjects[topic.subject] && snapshot.subjects[topic.subject].units[topic.unit];
    if (!topic.bankCount && unit && unit.bankCount && !unit.touchedCount) return 3 + topic.level;
    if (!topic.bankCount && unit && unit.bankCount) return 6 + topic.level;
    return 9 + topic.level;
  };
  const ranked = availableTopics
    .filter(topic => !topic.skip)
    .sort((a, b) =>
      priorityRank(a) - priorityRank(b) ||
      b.importance - a.importance ||
      b.weight - a.weight ||
      a.subject.localeCompare(b.subject) ||
      a.unit - b.unit
    );
  const selected = [];
  const selectedTopics = new Set();
  const selectedSubjects = new Set();
  ranked.forEach(topic => {
    if (selected.length >= limit || selectedSubjects.has(topic.subject)) return;
    selected.push(topic);
    selectedTopics.add(topic.id);
    selectedSubjects.add(topic.subject);
  });
  const selectedUnits = new Set(selected.map(topic => `${topic.subject}::${topic.unit}`));
  ranked.forEach(topic => {
    if (selected.length >= limit || selectedTopics.has(topic.id)) return;
    const key = `${topic.subject}::${topic.unit}`;
    if (selectedUnits.has(key)) return;
    selected.push(topic);
    selectedTopics.add(topic.id);
    selectedUnits.add(key);
  });
  ranked.forEach(topic => {
    if (selected.length >= limit || selectedTopics.has(topic.id)) return;
    selected.push(topic);
    selectedTopics.add(topic.id);
  });
  return selected;
}

function getConceptGapsList(limit = 5) {
  if (typeof V === 'undefined' || !V) return [];
  const candidates = [];
  const pool = (typeof bankQuestionPool === 'function') ? bankQuestionPool() : (D || []);
  const byIdentity = new Map();

  pool.forEach(q => {
    if (!q || isQuestionDeleted(q)) return;
    const k = qk(q);
    if (V[k] && Array.isArray(V[k].history) && V[k].history.length > 0) {
      byIdentity.set(k, q);
    }
  });

  byIdentity.forEach((q, k) => {
    const v = V[k];
    const hist = v.history;
    const last = hist[hist.length - 1];
    let score = 0;
    let reason = '';
    let type = '';

    // Check if resolved: latest answer was correct with Confidence 3 (Sure)
    const latestOkConf3 = last && last.ok && last.cf === 3;
    const isLeech = (v.lapses || 0) >= 2 || (v.missCount || 0) >= 2;

    // If latest attempt is confident and correct, check if leech is also recovered
    if (latestOkConf3) {
      if (!isLeech) return; // Completely resolved! Disappears from gaps.
      // If it was a leech, check if last 2 attempts are confident correct
      if (hist.length >= 2 && hist[hist.length - 2].ok && hist[hist.length - 2].cf === 3) {
        return; // Leech also resolved! Disappears from gaps.
      }
    }

    // 1. High-confidence miss (cf === 3, ok === false) - highest danger trap
    const recentConf3Miss = last && !last.ok && last.cf === 3;
    if (recentConf3Miss) {
      score += 100;
      reason = 'High-confidence trap (Missed at 3★)';
      type = 'trap';
    } else if (!last.ok) {
      score += 70;
      reason = 'Recent incorrect answer';
      type = 'miss';
    }

    // 2. Leech / repeated lapses (still active)
    if (isLeech && !latestOkConf3) {
      score += 50 + (v.lapses || v.missCount) * 10;
      if (!reason) {
        reason = `Repeated mistake (${v.lapses || v.missCount} lapses)`;
        type = 'leech';
      }
    }

    // 3. Hesitant lucky guess (ok === true, cf <= 2)
    if (last && last.ok && last.cf === 1) {
      score += 40;
      if (!reason) {
        reason = 'Lucky guess (Low confidence · needs solidification)';
        type = 'guess';
      }
    } else if (last && last.ok && last.cf === 2) {
      score += 20;
      if (!reason) {
        reason = 'Unsure (Confidence 2 · verify concept)';
        type = 'unsure';
      }
    }

    // Prioritize Tier A and B subjects
    const tier = subjectTier(q.s);
    if (tier === 'A') score += 15;
    else if (tier === 'B') score += 10;

    if (score > 0) {
      candidates.push({ q, k, v, score, reason, type, tier });
    }
  });

  return candidates.sort((a, b) => b.score - a.score).slice(0, limit);
}

function pickCoverageQuestions(pool, limit, snapshot, opts = {}) {
  const snap = snapshot || calculateUnitCoverage();
  const doneToday = opts.doneToday || questionsAnsweredToday();
  const excluded = opts.exclude || new Set();
  const questions = [];
  const unmapped = [];
  const seen = new Set();
  (pool || []).forEach(q => {
    if (!q || !normalSessionEligible(q) || isQuestionDeleted(q)) return;
    const identity = questionUid(q) || qk(q);
    if (seen.has(identity) || excluded.has(identity) || wasAnsweredToday(q, doneToday)) return;
    seen.add(identity);
    const unit = coverageUnitOfQuestion(snap, q);
    if (unit) questions.push({ q, identity, unit });
    else unmapped.push({ q, identity });
  });
  const allCandidates = [...questions, ...unmapped];
  if (allCandidates.length) {
    const preferredTier = Math.min(...allCandidates.map(item => questionPracticeTier(item.q)));
    for (let i = questions.length - 1; i >= 0; i--) {
      if (questionPracticeTier(questions[i].q) !== preferredTier) questions.splice(i, 1);
    }
    for (let i = unmapped.length - 1; i >= 0; i--) {
      if (questionPracticeTier(unmapped[i].q) !== preferredTier) unmapped.splice(i, 1);
    }
  }
  if (!questions.length && (!opts.includeUnmapped || !unmapped.length)) return [];

  const rankItems = items => items.sort((a, b) => {
    const va = V[qk(a.q)] || {}, vb = V[qk(b.q)] || {};
    const ha = va.history && va.history.length ? va.history[va.history.length - 1] : null;
    const hb = vb.history && vb.history.length ? vb.history[vb.history.length - 1] : null;
    const unseenA = !V[qk(a.q)] ? 0 : 1;
    const unseenB = !V[qk(b.q)] ? 0 : 1;
    if (unseenA !== unseenB) return unseenA - unseenB;
    const wrongA = ha && !ha.ok ? 0 : 1;
    const wrongB = hb && !hb.ok ? 0 : 1;
    if (wrongA !== wrongB) return wrongA - wrongB;
    return (effLevel(a.q) - effLevel(b.q)) || (Math.random() - 0.5);
  });

  const groups = new Map();
  questions.forEach(item => {
    const key = `${item.unit.subject}::${item.unit.unit}`;
    if (!groups.has(key)) groups.set(key, { key, unit: item.unit, items: [] });
    groups.get(key).items.push(item);
  });
  const sortedGroups = [...groups.values()];
  sortedGroups.forEach(group => rankItems(group.items));
  sortedGroups.sort((a, b) => {
    const ua = a.unit, ub = b.unit;
    const untouchedA = ua.touchedCount === 0 ? 0 : 1;
    const untouchedB = ub.touchedCount === 0 ? 0 : 1;
    if (untouchedA !== untouchedB) return untouchedA - untouchedB;
    if (ua.solid !== ub.solid) return ua.solid ? 1 : -1;
    const ratioA = ua.knownCount / Math.max(1, ua.bankCount);
    const ratioB = ub.knownCount / Math.max(1, ub.bankCount);
    if (ratioA !== ratioB) return ratioA - ratioB;
    const sa = snap.subjects[ua.subject], sb = snap.subjects[ub.subject];
    const subjectRatioA = sa ? sa.touchedUnits / Math.max(1, sa.unitCount) : 1;
    const subjectRatioB = sb ? sb.touchedUnits / Math.max(1, sb.unitCount) : 1;
    if (subjectRatioA !== subjectRatioB) return subjectRatioA - subjectRatioB;
    return (a.key < b.key ? -1 : a.key > b.key ? 1 : 0);
  });

  const maxPerUnit = Math.max(1, opts.maxPerUnit || 2);
  const selected = [];
  const used = new Set();
  for (let round = 0; round < maxPerUnit && selected.length < limit; round++) {
    for (const group of sortedGroups) {
      if (selected.length >= limit) break;
      const next = group.items.find(item => !used.has(item.identity));
      if (!next) continue;
      used.add(next.identity);
      selected.push(next.q);
    }
  }
  if (opts.includeUnmapped && selected.length < limit && unmapped.length) {
    rankItems(unmapped);
    for (const item of unmapped) {
      if (selected.length >= limit) break;
      selected.push(item.q);
    }
  }
  return selected;
}

function diagnosticSubjectStats() {
  const mockRecords = (L || []).filter(rec => rec && rec.mock === 1);
  if (!mockRecords.length) return { available: false, subjects: {}, source: 'none' };
  const tagged = mockRecords.filter(rec => rec.diag === 1);
  let records = [];
  if (tagged.length) {
    const lastDiagTime = Math.max(...tagged.map(rec => rec.t || 0));
    records = tagged.filter(rec => Math.abs((rec.t || 0) - lastDiagTime) <= 4 * 3600 * 1000);
  } else if (DIAGNOSTIC_DONE) {
    const groups = [];
    mockRecords
      .slice()
      .sort((a, b) => (a.t || 0) - (b.t || 0))
      .forEach(rec => {
        const t = rec.t || 0;
        const last = groups[groups.length - 1];
        if (!last || t - last.lastT > 2 * 3600 * 1000) groups.push({ lastT: t, records: [rec] });
        else { last.lastT = t; last.records.push(rec); }
      });
    const baseline = groups.find(group => group.records.length >= 40);
    records = baseline ? baseline.records : [];
  }
  if (!records.length) return { available: false, subjects: {}, source: 'none' };
  const bySubject = {};
  records.forEach(rec => {
    const q = findQuestionByRecord(rec);
    const subject = canonSubj(rec.s || (q && q.s) || '');
    if (!subject) return;
    const bucket = bySubject[subject] = bySubject[subject] || { total: 0, correct: 0 };
    bucket.total++;
    if (rec.ok) bucket.correct++;
  });
  const subjects = {};
  Object.entries(bySubject).forEach(([subject, bucket]) => {
    const acc = bucket.total ? bucket.correct / bucket.total : 0;
    subjects[subject] = {
      subject,
      total: bucket.total,
      correct: bucket.correct,
      acc,
      weak: bucket.total >= 3 && acc <= 0.40,
      borderline: bucket.total >= 3 && acc > 0.40 && acc < 0.80
    };
  });
  return { available: true, subjects, source: tagged.length ? 'diagnostic' : 'legacy-diagnostic' };
}

function milestoneSubjectSignals() {
  const practice = readinessStats().subjects;

  const names = new Set([...Object.keys(practice), ...Object.keys(diagnostic.subjects)]);
  const rows = [];
  names.forEach(subject => {
    const p = practice[subject];
    if (p && p.attempts >= 15) {
      rows.push({
        k: subject,
        tot: p.attempts,
        acc: p.score,
        target: p.target,
        source: 'practice',
        isWeak: p.score <= 0.40,
        isBorderline: p.score > 0.40 && p.score < p.target

    if (d) {
      rows.push({
        k: subject,
        tot: d.total,
        acc: d.acc,
        target: d.total >= 4 ? 0.80 : 0.80,
        source: diagnostic.source,
        isWeak: d.weak,
        isBorderline: d.borderline
      });
    }
  });
  return rows;
}

function clearDrillDeck() {
  if (Array.isArray(DRILL_D)) {
    DRILL_D.forEach(q => {
      if (!q) return;
      delete R[q.n];
      delete W[q.n];
    });
  }
  DRILL_D = [];
  DRILL_SUBJECT = '';
}

function bankQuestionPool() {
  const out = [], seen = new Set();
  const add = q => {
    if (!q) return;
    const key = bankQuestionKey(q);
    if (seen.has(key)) return;
    seen.add(key);
    out.push(q);
  };
  (BANKS || []).forEach(bank => {
    if (Array.isArray(bank.q)) bank.q.forEach(add);
  });
  if (Array.isArray(D)) D.forEach(add);
  return out;
}

function bankSubjects() {
  const set = new Set();
  bankQuestionPool().forEach(q => set.add(canonSubj(q.s)));
  (D || []).forEach(q => set.add(canonSubj(q.s)));
  return [...set].sort((a, b) => a.localeCompare(b));
}

function selectSubjectDrillQuestions(subjectName, requestedCount, includeAnsweredToday = false) {
  const norm = canonSubj(subjectName);
  const seen = new Set();
  const doneToday = questionsAnsweredToday();
  const subjectBank = bankQuestionPool().filter(q =>
    q && canonSubj(q.s) === norm && !isQuestionDeleted(q)
  );
  const eligible = subjectBank.filter(q => normalSessionEligible(q));
  const answeredTodayCount = eligible.filter(q => wasAnsweredToday(q, doneToday)).length;
  const pool = preferredPracticeQuestions(eligible.filter(q => includeAnsweredToday || !wasAnsweredToday(q, doneToday))).filter(q => {
    const key = questionUid(q) || qk(q);
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });

  const wanted = Number.isFinite(requestedCount) ? Math.floor(requestedCount) : 15;
  const count = Math.max(1, Math.min(pool.length, wanted));
  const unitKeys = new Set(pool.map(q => {
    const unit = questionScopeUnit(q);
    return unit == null ? null : `${canonSubj(q.s)}::${unit}`;
  }).filter(Boolean));
  const maxPerUnit = Math.max(2, Math.ceil(count / Math.max(1, unitKeys.size)));
  const selected = pickCoverageQuestions(pool, count, calculateUnitCoverage(), {
    maxPerUnit,
    doneToday: includeAnsweredToday ? new Set() : doneToday,
    includeUnmapped: true
  });
  return {
    pool,
    selected,
    total: pool.length,
    bankCount: subjectBank.length,
    eligibleCount: eligible.length,
    answeredTodayCount
  };
}

function startSubjectDrillFromBank(subjectName, requestedCount = 15) {
  let result = selectSubjectDrillQuestions(subjectName, requestedCount);
  if (!result.pool.length && result.answeredTodayCount > 0) {
    if (!confirm(`You have answered all ${result.answeredTodayCount} eligible ${subjectName} question(s) today. Repeat them now?`)) return;
    result = selectSubjectDrillQuestions(subjectName, requestedCount, true);
  }
  if (!result.bankCount) {
    alert(`No bank questions are available for ${subjectName}.`);
    return;
  }
  if (!result.pool.length) {
    alert(`No eligible questions are available for ${subjectName} right now. ${result.bankCount - result.eligibleCount} question(s) are cold, quarantined, out of scope, or code-trace restricted.`);
    return;
  }
  if (!result.selected.length) {
    alert('No mapped syllabus-unit questions are available for: ' + subjectName);
    return;
  }
  if (result.total < requestedCount) {
    alert(`Only ${result.total} question(s) are available for ${subjectName}. Starting all available questions.`);
  }
  clearDrillDeck();
  DRILL_SUBJECT = canonSubj(subjectName);
  DRILL_D = result.selected.map((q, i) => ({ ...q, n: DRILL_N_BASE + i }));
  start(DRILL_D.map(q => q.n));
}

function startSyllabusUnitDrill(subjectName, unitNumber, topicId) {
  const subject = canonSubj(subjectName);
  const doneToday = questionsAnsweredToday();
  const unitPool = bankQuestionPool().filter(q =>
    q &&
    canonSubj(q.s) === subject &&
    questionScopeUnit(q) === Number(unitNumber) &&
    !isQuestionQuarantined(q) &&
    normalSessionEligible(q) &&
    !isQuestionDeleted(q) &&
    !wasAnsweredToday(q, doneToday)
  );
  const topicPool = unitPool.filter(q => String(q.topic_id || '').trim() === String(topicId || '').trim());
  const pool = topicPool.length ? topicPool : unitPool;
  if (!pool.length) {
    alert(`No eligible questions are available for ${subjectName}, Unit ${unitNumber}.`);
    return;
  }
  const count = Math.min(15, pool.length);
  const selected = pickCoverageQuestions(pool, count, calculateUnitCoverage(), {
    maxPerUnit: count,
    doneToday,
    includeUnmapped: true
  });
  if (!selected.length) {
    alert(`No unattempted questions are available for ${subjectName}, Unit ${unitNumber} today.`);
    return;
  }
  clearDrillDeck();
  DRILL_SUBJECT = subject;
  DRILL_D = selected.map((q, index) => ({ ...q, n: DRILL_N_BASE + index }));
  if (!topicPool.length) {
    showToast('No questions are explicitly mapped to this concept yet. Starting a unit-level drill; concept mastery will not be inferred.');
  } else {
    showToast(`Starting focused practice for ${topicPool.length} question(s) mapped to this concept.`);
  }
  start(DRILL_D.map(q => q.n));
}

function buildRevisionSession(limit = 12) {
  const questions = new Map();
  const doneToday = questionsAnsweredToday();
  bankQuestionPool().forEach(q => {
    if (q && normalSessionEligible(q)) {
      questions.set(qk(q), { key: q.n != null ? q.n : (questionUid(q) || qk(q)), q });
    }
  });
  A.forEach((attempt, ai) => (attempt.errs || []).forEach((q, qi) => {
    const key = `${ai}:${qi}`;
    questions.set(qk(q), { key, q });
  }));

  const subjectData = agg();
  const currentMisses = new Set((D || [])
    .filter(q => R[q.n] === 'w' || R[q.n] === 's')
    .map(q => qk(q)));
  const due = new Set(dueKeys().map(key => {
    const q = byN(key);
    return q ? qk(q) : null;
  }).filter(Boolean));

  const candidates = [...questions.entries()]
    .map(([key, item]) => {
      if (!normalSessionEligible(item.q)) return null;
      if (wasAnsweredToday(item.q, doneToday)) return null;
      const history = V[key] && Array.isArray(V[key].history) ? V[key].history : [];
      if (!history.length) return null;
      const correct = history.filter(h => h.ok).length;
      const subject = subjectData[canonSubj(item.q.s)];
      const subjectAccuracy = subject && subject.c + subject.w + subject.k
        ? subject.c / (subject.c + subject.w + subject.k)
        : 1;
      return {
        key: item.key,
        q: item.q,
        due: due.has(key),
        missed: currentMisses.has(key) || (V[key].missCount || 0) > 0,
        subjectAccuracy,
        accuracy: correct / history.length,
        lastAttempt: history[history.length - 1].t || 0
      };
    })
    .filter(Boolean);
  const preferredIds = new Set(preferredPracticeQuestions(
    candidates.map(item => item.q)
  ).map(q => questionUid(q) || qk(q)));
  candidates.splice(0, candidates.length, ...candidates.filter(item =>
    preferredIds.has(questionUid(item.q) || qk(item.q))
  ));
  candidates
    .sort((a, b) =>
      Number(b.due) - Number(a.due) ||
      Number(b.missed) - Number(a.missed) ||
      a.subjectAccuracy - b.subjectAccuracy ||
      a.accuracy - b.accuracy ||
      a.lastAttempt - b.lastAttempt
    );

  return groupQuestionBlocks(candidates.slice(0, limit).map(item => item.key));
}

  ));

  const dueOrder = new Map();
  dueKeys(true, true).forEach((key, index) => {
    const q = byN(key);
    if (q) dueOrder.set(keyOf(q), index);
  });
  const due = pool.filter(q => dueOrder.has(keyOf(q)))
    .sort((a, b) => dueOrder.get(keyOf(a)) - dueOrder.get(keyOf(b)));
  const dueIds = new Set(due.map(keyOf));
  const unseen = pool.filter(q => !dueIds.has(keyOf(q)) && !hasPracticeAttempt(q, latestPractice));
  const unseenOrdered = pickCoverageQuestions(unseen, unseen.length, calculateUnitCoverage(), {
    maxPerUnit: Math.max(1, unseen.length),

    doneToday
  });
  const unseenIds = new Set(unseenOrdered.map(keyOf));
  const struggled = pool.filter(q => {
    if (dueIds.has(keyOf(q)) || unseenIds.has(keyOf(q))) return false;
    const last = latestPracticeRecordFor(q, latestPractice);
    return !!last && (!last.ok || (last.cf != null && last.cf < 3));
  });
  struggled.sort((a, b) => {
    const aLast = latestPracticeRecordFor(a, latestPractice);
    const bLast = latestPracticeRecordFor(b, latestPractice);
    const aWrong = aLast && !aLast.ok ? 0 : 1;
    const bWrong = bLast && !bLast.ok ? 0 : 1;
    return aWrong - bWrong ||
      ((aLast && aLast.cf != null ? aLast.cf : 3) - (bLast && bLast.cf != null ? bLast.cf : 3)) ||
      ((bLast && bLast.t) || 0) - ((aLast && aLast.t) || 0);
  });
  const struggledIds = new Set(struggled.map(keyOf));
  const remaining = pool.filter(q =>
    !dueIds.has(keyOf(q)) && !unseenIds.has(keyOf(q)) && !struggledIds.has(keyOf(q))
  );
  remaining.sort((a, b) => {
    const aLast = latestPracticeRecordFor(a, latestPractice);
    const bLast = latestPracticeRecordFor(b, latestPractice);
    return ((aLast && aLast.t) || 0) - ((bLast && bLast.t) || 0) ||
      (effLevel(a) - effLevel(b)) ||
      (Math.random() - 0.5);
  });
  const list = [...due, ...unseenOrdered, ...struggled, ...remaining];
  if (!list.length) { alert('No quick questions available.'); return; }
  const targetQ = Math.max(10, Math.round((todayMins || 15) * 0.8));
  if (list.length < targetQ && !confirm(`Only ${list.length} unanswered quick question(s) are available today. Start a shorter session? Questions answered today will not be repeated.`)) return;
  isQuick = true;
  try { localStorage.setItem('bitmcq_quick', 'true'); } catch(e){}
  start(list.slice(0, targetQ).map(keyOf));
}

  const s = String(q.s || '').toLowerCase();

  if ((s.includes('c prog') || s.includes('c++') || s.includes('data structure')) &&
      (code || looksLikeCode(stem) || /#include|printf|scanf|cout|cin/i.test(stem))) {
    return true;

  return false;

// Deterministic Math/Calc Families (verified in code, 100% accurate, zero AI hallucination)
const rndInt = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pickItem = arr => arr[rndInt(0, arr.length - 1)];
const shuffleList = arr => arr.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(p => p[1]);

function calcOptions(answer, candidates) {
  const seen = new Set([answer]);
  const opts = [answer];
  for (const candidate of candidates) {
    if (opts.length >= 4) break;
    const value = Number(candidate);
    if (!Number.isFinite(value) || seen.has(value)) continue;
    seen.add(value);
    opts.push(value);
  }
  let bump = 1;
  while (opts.length < 4) {
    const value = answer + bump++;
    if (seen.has(value)) continue;
    seen.add(value);
    opts.push(value);
  }
  return shuffleList(opts);
}

function genPageBitsQuestion() {
  const pageKB = pickItem([1, 2, 4, 8]);
  const spaceKB = pageKB * pickItem([16, 32, 64, 128, 256]);
  const pageBits = Math.log2(spaceKB / pageKB);
  const offsetBits = Math.log2(pageKB * 1024);
  const totalBits = Math.log2(spaceKB * 1024);
  const four = calcOptions(pageBits, [offsetBits, totalBits, Math.log2(spaceKB), spaceKB / pageKB]);
  return {
    id: `calc_os_page_${spaceKB}_${pageKB}`,
    s: 'Operating Systems',
    q: `A system has a ${spaceKB} KB virtual address space and ${pageKB} KB pages. How many bits form the page number (VPN)?`,
    o: four.map(String),
    a: four.indexOf(pageBits),
    e: `${spaceKB} KB / ${pageKB} KB = ${spaceKB / pageKB} pages = 2^${pageBits}. So ${pageBits} bits form the page number.`,
    calc: true,
    needs_paper: true,
    type: 'calc',
    level: 0
  };
}

function genDetScaleQuestion() {
  const n = pickItem([2, 3, 4]); const k = pickItem([2, 3]); const d = pickItem([2, 3, 4, 5]);
  const ans = Math.pow(k, n) * d;
  const four = calcOptions(ans, [k * d, Math.pow(k, 2) * d, Math.pow(k, n), k * n * d]);
  return {
    id: `calc_det_${n}x${n}_k${k}_d${d}`,
    s: 'Linear & Abstract Algebra',
    q: `A is a ${n}x${n} matrix with det(A) = ${d}. What is det(${k}A)?`,
    o: four.map(String),
    a: four.indexOf(ans),
    e: `det(kA) = k^n * det(A) = ${k}^${n} * ${d} = ${ans}.`,
    calc: true,
    needs_paper: true,
    type: 'calc',
    level: 0
  };
}

function genPipelineCyclesQuestion() {
  const k = pickItem([4, 5, 6]);
  const n = pickItem([10, 20, 50, 100]);
  const ans = k + n - 1;
  const four = calcOptions(ans, [k * n, k + n, (k - 1) * n, k + n - 2]);
  return {
    id: `calc_pipeline_k${k}_n${n}`,
    s: 'Microprocessor & Computer Architecture',
    q: `In a processor pipeline with ${k} stages and no stalls or hazards, how many clock cycles are needed to execute ${n} independent instructions?`,
    o: four.map(String),
    a: four.indexOf(ans),
    e: `Clock cycles = k + (n - 1) = ${k} + (${n} - 1) = ${ans}.`,
    calc: true,
    needs_paper: true,
    type: 'calc',
    level: 0
  };
}

  const candidates = preferredQuestionTier(bankQuestionPool().filter(q => {
    if (!q || isQuestionDeleted(q) || isQuestionQuarantined(q) || isColdQuestion(q) || isQuestionOutOfScope(q)) return false;

function isOptionDependentQuestion(q) {
  const stem = String(q && q.q || '').trim();
  return /\b(?:which|what)\s+(?:one|of\s+(?:the\s+)?(?:following|these|options?|choices?)|option|choice|statement|pair|algorithm|protocol|layer|device|type|method)\b|\bwhich\s+(?:of\s+)?(?:is|are)\s+(?:the\s+)?(?:correct|incorrect|true|false|valid|invalid|not\s+true|not\s+false|best|most\s+appropriate)\b|\b(?:select|choose|identify|pick)\s+(?:the\s+)?(?:correct|incorrect|true|false|matching|odd\s+one|best)\s+(?:option|choice|statement|answer|pair)\b|\bwhich\s+statement\s+(?:is|about|regarding)\b|\bof\s+the\s+following\b|\ball\s+of\s+the\s+following\s+(?:are|is|except)\b/i.test(stem);
}

// Render the current question and restore per-position answer/history; keep mock and practice paths distinct.
function show() {
  view = 'q';
  cancelAutoAdvance();
  locked = false;
  ET = -1;
  cancelRecallTimer();

  if (P >= Q.length) {
    try {
      const d = localDateKey();
      if(localStorage.getItem('bitmcq_today_date')===d){
        const doneToday = parseInt(localStorage.getItem('bitmcq_today_done')||'0',10);
        const add = Math.max(1, Math.min(10, Math.round((Q.length||1)*0.6)));
        localStorage.setItem('bitmcq_today_done', String(doneToday + add));
        if(doneToday + add >= (todayMins||15)) localStorage.setItem('bitmcq_today_date', d);
      } else {
        localStorage.setItem('bitmcq_today_date', d);
        localStorage.setItem('bitmcq_today_done', String(Math.max(1, Math.min(10, Math.round((Q.length||1)*0.6)))));
      }
    } catch(e){}
    return MK ? mockEnd() : done();
  }

  const rawQ = byN(Q[P]);
  if (!rawQ) {
    if (P + 1 < Q.length) {
      P++;
      return show();
    }
    return MK ? mockEnd() : done();
  }
  const vRec = V[qk(rawQ)];

  // Session History Stack: restore exact options and answer if navigated back
  let hist = sessionHistory[P];
  if (!hist || hist.qKey !== qk(rawQ)) {
    CURRENT_Q = prepareQuestionForDisplay(rawQ);
    hist = {
      qKey: qk(rawQ),
      CURRENT_Q: CURRENT_Q,
      locked: false,
      chosenIdx: undefined,
      origPickedIndex: undefined,
      ok: undefined,
      recordedFirstAttempt: false,
      feedbackHtml: ''
    };
    sessionHistory[P] = hist;
  } else {
    CURRENT_Q = hist.CURRENT_Q;
    locked = !!hist.locked;

function toggleOriginalStem(n) {

  if (!variant) return;
  vRec._useOriginal = !vRec._useOriginal;
  q._useOriginal = vRec._useOriginal;

  }

          <span class="opt-text">${esc(o)}</span>

    }).join('');

    if (isMock) {
      if (mockAnswer === i) cls += ' ans';

      </button>

function renderQuestionStem(stem) {
  const text = String(stem || '');
  const fence = /```(?:(?:c|cpp|c\+\+)(?=[ \t]|\r?\n))?[ \t]*\r?\n?([\s\S]*?)```/gi;
  let html = '', lastIndex = 0, match;

  while ((match = fence.exec(text))) {
    html += hl(esc(text.slice(lastIndex, match.index)));
    const code = match[1].replace(/^\r?\n/, '').replace(/\r?\n$/, '').replace(/[ \t]+$/, '');
    html += `<pre>${esc(code)}</pre>`;
    lastIndex = fence.lastIndex;
  }

  return html + hl(esc(text.slice(lastIndex)));
}

// Revise confidence after grading and reschedule the same attempt; keep feedback and session history aligned.
function updateConfidence(cf) {
  try { cancelAutoAdvance(); } catch(e){}
  if (!REC || !CURRENT_Q) return;
  const rawQ = CURRENT_Q.origQ || byN(Q[P]);
  const timeTakenMs = Math.max(500, Date.now() - (questionStartTime || Date.now()));
  REC.cf = cf;
  sr(rawQ, REC.ok, cf, timeTakenMs);
  const hist = sessionHistory[P];
  if (hist) {
    hist.cf = cf;
    const fbEl = $('#fb');
    if (fbEl) hist.feedbackHtml = fbEl.innerHTML;
  }
  document.querySelectorAll('.cf-btn').forEach(b => {
    b.classList.toggle('on', +b.dataset.cf === cf);
  });
  save();
}

function toggleCalcPanel() {

    const input = $('#calc-input');
    if (input) setTimeout(() => input.focus(), 20);
  }
}

function evalCalc() {
  const input = $('#calc-input');
  const out = $('#calc-result');
  if (!input || !out) return;
  const expr = String(input.value || '').trim();
  if (!expr) { out.textContent = ''; return; }
  if (!/^[0-9+\-*/().%\s]+$/.test(expr)) {
    out.textContent = 'Only numbers and + - * / ( ) % are allowed.';
    return;
  }
  try {
    const value = Function('"use strict";return (' + expr + ')')();
    out.innerHTML = `= <b>${esc(String(value))}</b>`;
  } catch (err) {
    out.textContent = 'Invalid expression.';
  }
}

// Shared answer path for practice and mocks; updates attempt history, scheduling, feedback, and linked-card UI.
function pick(i, cfOverride) {
  if (locked) return;
  if (MK && MK.expired) return;
  if (recallWaiting) revealRecallOptions();

  const rawQ = CURRENT_Q.origQ || byN(Q[P]);
  if (CURRENT_Q && CURRENT_Q.qType === 'fr' && !cfOverride) {
    return;
  }

  if (MK) {
    const origPickedIndex = CURRENT_Q.origO.indexOf(CURRENT_Q.displayOpts[i]);
    const chosenIndex = origPickedIndex >= 0 ? origPickedIndex : i;
    MK.a[CURRENT_Q.origQ.n] = chosenIndex;
    MK.displayA = MK.displayA || {};
    MK.displayA[CURRENT_Q.origQ.n] = i;
    let hist = sessionHistory[P];
    if (!hist) hist = sessionHistory[P] = { qKey: qk(rawQ), CURRENT_Q };
    hist.chosenIdx = i;
    hist.origPickedIndex = chosenIndex;
    hist.ok = (i === CURRENT_Q.displayA);
    persistMockState();
    save();
    next();
    return;
  }

  locked = true;
  const k = rawQ._k || rawQ.n;
  let ok = (i === CURRENT_Q.displayA);
  if (CURRENT_Q && CURRENT_Q.qType === 'tf' && Array.isArray(CURRENT_Q.displayOpts)) {
    ok = (i === CURRENT_Q.displayA);
  }
  QRESULTS[P] = ok ? 'c' : 'w';
  const origPickedIndex = CURRENT_Q.origO.indexOf(CURRENT_Q.displayOpts[i]);

function updateVariantQueueStatus(message = '') {
  const boxes = document.querySelectorAll('#bg-gen-box');
  if (!boxes.length) return;
  let text = message;
  if (!text) {
    const pending = bgGenQueue.length + (genInProgress ? 1 : 0);
    if (pending) {
      text = `✨ Refreshing variants in background: ${pending} queued · ${variantRefreshDone} refreshed · ${variantRefreshSkipped} skipped`;
    } else if (variantRefreshDone || variantRefreshSkipped) {
      text = `✨ Variant refresh: ${variantRefreshDone} refreshed · ${variantRefreshSkipped} skipped`;
    }
  }
  boxes.forEach(box => {
    if (!text) { box.style.display = 'none'; box.textContent = ''; return; }
    box.style.display = 'flex';
    box.textContent = text;
  });
}

function enqueueVariantRefresh(q, opts = {}) {
  if (!q || !GEM_KEY || MK) return false;
  if (effWellMade(q) || isQuestionDeleted(q)) return false;
  const uid = ensureQuestionUid(q);
  if (variantRefreshTouched.has(uid) || variantRefreshCurrentKey === uid || bgGenQueue.some(job => job.key === uid)) return false;
  if (variantRefreshSessionCount + bgGenQueue.length >= VARIANT_REFRESH_SESSION_CAP) return false;
  bgGenQueue.push({
    key: uid,
    q: Object.assign({}, q),
    priority: opts.priority ? 1 : 0,
    queuedAt: Date.now()
  });
  bgGenQueue.sort((a, b) => (b.priority - a.priority) || (a.queuedAt - b.queuedAt));
  variantRefreshTouched.add(uid);
  updateVariantQueueStatus();
  drainVariantQueue();
  return true;
}

function enqueueEligibleVariantRefresh(sessionKeys) {
  if (!GEM_KEY) return 0;
  let added = 0;
  (sessionKeys || []).forEach(key => {
    const q = byN(key);
    if (q && !effWellMade(q) && enqueueVariantRefresh(q)) added++;
  });
  return added;
}

function enqueueCurrentVariantRefresh() {
  if (!CURRENT_Q || P >= Q.length) return;
  const rawQ = CURRENT_Q.origQ || byN(Q[P]);
  if (rawQ) enqueueVariantRefresh(rawQ, { priority: true });
}

async function drainVariantQueue() {
  if (genInProgress || !bgGenQueue.length) {
    updateVariantQueueStatus();
    return;
  }
  if (MK) {
    updateVariantQueueStatus('✨ Variant refresh paused during the timed mock.');
    return;
  }
  if (!GEM_KEY) {
    bgGenQueue = [];
    updateVariantQueueStatus('✨ Variant refresh paused: add a Gemini API key in Settings.');
    return;
  }
  if (variantRefreshSessionCount >= VARIANT_REFRESH_SESSION_CAP) {
    bgGenQueue = [];
    updateVariantQueueStatus(`✨ Variant refresh paused at the ${VARIANT_REFRESH_SESSION_CAP}-question session cap.`);
    return;
  }
  if (getDailyApiCount() + 2 > DAILY_API_LIMIT) {
    bgGenQueue = [];
    updateVariantQueueStatus('✨ Variant refresh paused at today’s API limit.');
    return;
  }

  const job = bgGenQueue.shift();
  genInProgress = true;
  variantRefreshCurrentKey = job.key;
  variantRefreshSessionCount++;
  updateVariantQueueStatus();

  try {
    const current = findQuestionByUid(job.key) || job.q;
    if (!current || isQuestionDeleted(current) || effWellMade(current)) {
      variantRefreshSkipped++;
    } else {
      await rewriteQuestionWithGemini(current, { background: true });
      variantRefreshDone++;
    }
  } catch (err) {
    if (err && err.code === 'mock-paused') {
      bgGenQueue.unshift(job);
      variantRefreshTouched.delete(job.key);
      variantRefreshSessionCount = Math.max(0, variantRefreshSessionCount - 1);
    } else {
      variantRefreshSkipped++;
      console.warn('Background variant refresh skipped:', err && err.message ? err.message : err);
    }
  } finally {
    genInProgress = false;
    variantRefreshCurrentKey = '';
    save();
    updateVariantQueueStatus();
    if (bgGenQueue.length && !MK) setTimeout(drainVariantQueue, 350);
  }
}

// Safe JSON extractor that handles markdown code fences, conversational preambles, and unescaped characters
function extractJson(text) {
  if (!text) throw new Error('Empty response from model');
  let clean = text.replace(/```json/gi, '').replace(/```/g, '').trim();
  try {
    return JSON.parse(clean);
  } catch (e) {
    const startObj = clean.indexOf('{');
    const endObj = clean.lastIndexOf('}');
    if (startObj !== -1 && endObj > startObj) {
      try {
        return JSON.parse(clean.slice(startObj, endObj + 1));
      } catch (e2) {}
    }
    const startArr = clean.indexOf('[');
    const endArr = clean.lastIndexOf(']');
    if (startArr !== -1 && endArr > startArr) {
      try {
        return JSON.parse(clean.slice(startArr, endArr + 1));
      } catch (e3) {}
    }
    throw e;
  }
}

// Gemini Prompts A, B, C Implementation with Automatic Fallback (gemini_prompts.md)
// Primary: gemini-3.8-flash. If exhausted (429) or errors -> automatically falls back to gemini-2.0-flash-lite
async function fetchGeminiWithFallback(promptText, temp = 0.7, preferredModel = null, timeoutMs = 15000, jsonMode = false) {
  const models = [
    preferredModel || GEM_GEN_MODEL || 'gemini-3.8-flash',
    GEM_FALLBACK_MODEL || 'gemini-2.5-flash-lite'
  ].filter((m, i, a) => m && a.indexOf(m) === i);

  let lastError = null;
  for (const m of models) {
    try {
      recordApiCall();
      const cleanM = m.replace(/^models\//, '');
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), timeoutMs);
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cleanM)}:generateContent?key=${encodeURIComponent(GEM_KEY)}`;
      const genConfig = { temperature: temp };
      if (jsonMode) {
        genConfig.responseMimeType = 'application/json';
      }
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }],
          generationConfig: genConfig
        }),
        signal: controller.signal
      });
      clearTimeout(timeout);
      const data = await res.json();
      if (!res.ok) {
        throw new Error(data.error?.message || `HTTP ${res.status}`);
      }
      const txt = data.candidates?.[0]?.content?.parts?.[0]?.text;
      if (!txt) throw new Error('Empty response from model');
      return { text: txt, modelUsed: cleanM };
    } catch (err) {
      console.warn(`Model ${m} error or quota exhausted (${err.message}). Trying fallback if available...`);
      lastError = err;
    }
  }
  throw lastError || new Error('All configured Gemini models failed.');
}

  }
  const promptA = 'You explain MCQ answers for a BSc CSIT graduate preparing for the MIT entrance exam. Rusty, not a beginner. Explain in 1-3 sentences: why the correct option is right, then name the specific mistake that each wrong option represents. Be direct and concise. Return ONLY valid JSON: {"explanation": "string"}';
  const inputQ = {
    question: rawQ.q,
    options: rawQ.o,
    correct_option: rawQ.o[rawQ.a],

  };

      const stillCurrent = !!nowUid && nowUid === targetUid;
      const expContainer = stillCurrent ? $('#current-exp-container') : null;

    if (btn) {

      btn.innerHTML = '💡 Why? (Explain with AI)';

async function fillExplanationsWithGemini() {
  if (!GEM_KEY || !D || !D.length) return;
  const missing = D.filter(q => !q.e || q.e.trim() === '').slice(0, 15);
  if (!missing.length) return;

  const promptA = 'You explain MCQ answers for a BSc CSIT graduate preparing for the MIT entrance exam. Rusty, not a beginner. For each question return ONE explanation of 1-3 sentences: why the key is right, then name the specific mistake that each wrong option represents. No new topics. Do not change the key. Return JSON array: [{"id": 1, "explanation": "string"}]';
  const inputList = missing.map(q => ({ id: q.n, question: q.q, options: q.o, answer: q.a }));

  try {
    const res = await fetchGeminiWithFallback(promptA + '\n\nInput Questions:\n' + JSON.stringify(inputList), 0.3, GEM_GEN_MODEL, 15000, true);
    const list = extractJson(res.text);
    if (Array.isArray(list)) {
      list.forEach(item => {
        const q = byN(item.id);
        if (q && item.explanation) q.e = item.explanation;
      });
      save();
    }
  } catch (err) {
    console.warn('Background explanation fill error:', err);
  }
}

function normalizeVariantAnswer(raw) {
  if (typeof raw === 'number' && raw >= 0 && raw < 4) return raw;
  const text = String(raw == null ? '' : raw).trim().toUpperCase();
  if (/^[0-3]$/.test(text)) return parseInt(text, 10);
  if (/^[A-D]$/.test(text)) return 'ABCD'.indexOf(text);
  return -1;
}

async function rewriteQuestionWithGemini(targetQ, opts = {}) {
  if (!GEM_KEY) return Promise.reject(new Error('No API key'));
  if (effWellMade(targetQ)) return Promise.reject(new Error('This question is marked Well made.'));
  try {
    const k = qk(targetQ);
    const vRec = V[k] = V[k] || {};
    const pastValues = Array.isArray(vRec._pastValues) ? vRec._pastValues : [];
    const previousVariantStem = vRec._variant && vRec._variant.q ? [vRec._variant.q] : [];
    const avoid = opts.correction ? [] : [...pastValues, ...previousVariantStem].filter(Boolean);

    const sourceQuestion = opts.sourceOverride || targetQ;
    const source = {
      subject: targetQ.s,
      unit: targetQ.u || targetQ.unit || '',
      unit_name: targetQ.unit_name || targetQ.t || '',
      topic_id: targetQ.topic_id || '',
      tag: targetQ.t || targetQ.tag || '',
      type: targetQ.type || '',
      stem: sourceQuestion.q,
      code: sourceQuestion.code || targetQ.code || [],
      options: sourceQuestion.o || targetQ.o,
      answer: sourceQuestion.a == null ? targetQ.a : sourceQuestion.a,
      why: sourceQuestion.e || targetQ.e || '',
      avoid,
      is_cold_marked: isColdQuestion(targetQ) && !opts.correction
    };

    const isCorrection = opts.correction === true;
    const isCold = isColdQuestion(targetQ) && !isCorrection;
    const coldRule = isCold
      ? ' SPECIAL RULE: This is a replacement for a question the student marked too easy. Keep the same broad concept and exact subject/unit/topic, but test a clearly DIFFERENT microconcept within that subunit. Do not paraphrase, reuse the same fact, or merely change numbers/scenario. If no genuinely useful sibling microconcept exists, say so in sibling_reason and the validator should reject it.'
      : '';
    const promptB = isCorrection
      ? 'You are an expert exam writer reviewing a question flagged as possibly incorrect. Correct factual, mathematical, coding, answer-key, or explanation errors while preserving the original learning objective and difficulty. Do not introduce an unrelated concept. If the source is already correct, return a corrected equivalent question with the same intended answer. Solve it independently and return a clear explanation. '
      : 'You are an expert exam writer. Create ONE new MCQ in the SAME SUBJECT and SAME UNIT/TOPIC as the source, but test a SIBLING sub-skill or adjacent idea rather than repeating the exact same fact with reworded options. State source_microconcept and microconcept separately, and explain the relationship in sibling_reason. For factual, definitional, or programming-concept questions, target a different property, comparison, consequence, or application, not just a rewording. For calculation, trace, or code questions, test a different operation or principle, not merely different numbers or a scenario swap. If the unit offers no meaningful sibling, say so rather than inventing an unrelated question.';
    const fullPrompt = isCorrection
      ? promptB + ' Rules: Keep the same subject, unit, topic_id, learning objective, and difficulty. Correct the flagged error rather than avoiding or paraphrasing the source. Solve independently in "working"; ensure the answer and explanation agree. Return ONLY valid JSON: {"stem":"string","code":["string"],"options":["A","B","C","D"],"answer":0,"working":"string","slips":["string"],"why":"string","source_microconcept":"string","microconcept":"string","sibling_reason":"string"}'
      : promptB + coldRule + ' Rules: 1. Keep the same subject, unit, topic_id, and difficulty as the source. 2. Solve it step by step yourself first in "working". 3. Each wrong option must be a specific plausible slip named in "slips". 4. Keep the four options similar in length, but never sacrifice correctness for length. 5. Avoid degenerate values (0, 1, equal numbers), do not reuse numbers or stems listed in "avoid", and do not duplicate any prior variant. 6. Return ONLY valid JSON: {"stem":"string","code":["string"],"options":["A","B","C","D"],"answer":0,"working":"string","slips":["string"],"why":"string","source_microconcept":"string","microconcept":"string","sibling_reason":"string"}';

    const genResult = await fetchGeminiWithFallback(fullPrompt + '\n\nSource Question:\n' + JSON.stringify(source), isCorrection ? 0.2 : 0.8, GEM_GEN_MODEL, 18000, true);
    const v = extractJson(genResult.text);
    const generatedOptions = Array.isArray(v.options)
      ? v.options.slice()
      : (v.options && typeof v.options === 'object'
        ? ['A', 'B', 'C', 'D'].map(key => v.options[key] != null ? v.options[key] : v.options[key.toLowerCase()])
        : null);
    const generatedAnswer = normalizeVariantAnswer(v.answer);
    if (!v.stem || !generatedOptions || generatedOptions.length !== 4 ||
        generatedOptions.some(option => option == null || String(option).trim() === '') ||
        generatedAnswer < 0) {
      throw new Error('Gemini returned an invalid variant shape.');
    }
    if (isCold && (!String(v.source_microconcept || '').trim() ||
        !String(v.microconcept || '').trim() ||
        !String(v.sibling_reason || '').trim() ||
        String(v.source_microconcept).trim().toLowerCase() === String(v.microconcept).trim().toLowerCase())) {
      throw new Error('Gemini did not identify a distinct sibling microconcept.');
    }

    const blindPrompt = 'Solve this multiple choice question step by step without bias. Identify the single correct option index (0 for first, 1 for second, 2 for third, 3 for fourth; A-D is also accepted). Return ONLY valid JSON: {"answer":0,"why":"string"}';
    const genUsed = (genResult && genResult.modelUsed) ? genResult.modelUsed : (GEM_GEN_MODEL || '');
    const verifyPref = (String(genUsed).includes('lite')) ? (GEM_FALLBACK_MODEL || 'gemini-2.5-flash-lite') : (GEM_VERIFY_MODEL || GEM_GEN_MODEL);
    const blindResultRaw = await fetchGeminiWithFallback(
      blindPrompt + '\n\nQuestion to solve:\n' + JSON.stringify({ stem: v.stem, code: v.code || [], options: generatedOptions }),
      0.2,
      verifyPref,
      15000,
      true
    );
    const blindResult = extractJson(blindResultRaw.text);
    const verifiedAnswer = normalizeVariantAnswer(blindResult.answer);
    if (verifiedAnswer !== generatedAnswer) {
      throw new Error(`Blind verification mismatch (generated ${generatedAnswer}, verifier ${blindResult.answer}).`);
    }
    if (isCold) {
      const siblingPrompt = 'Independently review whether the proposed replacement is suitable. The original and replacement must keep the same subject and the same stated unit/topic, stay within the same broad concept, and test genuinely different microconcepts. A paraphrase, new wording, changed numbers, or changed scenario alone is NOT a different microconcept. If no defensible sibling exists, reject it. Return ONLY JSON: {"same_subject":true,"same_unit_topic":true,"same_broad_concept":true,"different_microconcept":true,"reason":"string"}';
      const siblingRaw = await fetchGeminiWithFallback(
        siblingPrompt + '\n\nSource and proposed sibling:\n' + JSON.stringify({
          subject: source.subject,
          unit: source.unit,
          unit_name: source.unit_name,
          topic_id: source.topic_id,
          source_microconcept: v.source_microconcept,
          source_stem: source.stem,
          sibling_microconcept: v.microconcept,
          sibling_stem: v.stem,
          sibling_reason: v.sibling_reason
        }),
        0.1,
        verifyPref,
        15000,
        true
      );
      const siblingReview = extractJson(siblingRaw.text);
      if (!siblingReview || siblingReview.same_subject !== true ||
          siblingReview.same_unit_topic !== true ||
          siblingReview.same_broad_concept !== true ||
          siblingReview.different_microconcept !== true) {
        throw new Error(`The proposed question did not pass sibling validation: ${String(siblingReview && siblingReview.reason || 'not a clearly different microconcept')}`);
      }
    }

    const origIndices = [0, 1, 2, 3].sort(() => Math.random() - 0.5);
    const randomizedOpts = origIndices.map(idx => generatedOptions[idx]);
    const newAnswerIdx = origIndices.indexOf(generatedAnswer);

    if (opts.background && (isQuestionDeleted(targetQ) || effWellMade(targetQ) ||
        (isCorrection ? !isQuestionQuarantined(targetQ) : isQuestionQuarantined(targetQ)))) {
      throw new Error('Question is no longer eligible for background refresh.');
    }
    if (opts.background && MK) {
      const paused = new Error('Background refresh paused during timed mock.');
      paused.code = 'mock-paused';
      throw paused;
    }

    vRec._pastValues = [...pastValues.slice(-6), String(v.stem).slice(0, 30)];
    vRec._variant = {
      q: String(v.stem),
      o: randomizedOpts.map(String),
      a: newAnswerIdx,
      e: v.why || v.working || targetQ.e || '',
      code: Array.isArray(v.code) ? v.code.map(String) : [],
      ...(isCold ? {
        sourceMicroconcept: String(v.source_microconcept).trim(),
        microconcept: String(v.microconcept).trim(),
        siblingReason: String(v.sibling_reason).trim()
      } : {}),
      verified: true,
      modelUsed: genResult.modelUsed,
      date: Date.now()
    };
    vRec._useOriginal = false;
    save();

    if (!opts.background) {
      const bgBox = $('#bg-gen-box');
      if (bgBox) {
        bgBox.style.display = 'flex';
        bgBox.textContent = `✓ Q${targetQ.n != null ? targetQ.n : ''} (${targetQ.s}): Variant generated via ${genResult.modelUsed} (verified).`;
      }
    }
    return vRec._variant;
  } catch (err) {
    console.warn('AI variant generation error:', err);
    throw err;
  }
}

// One-tap deletion of variant if student spots any flaw
function deleteVariant(n) {
  const q = byN(n);

  const k = qk(q);
  if (V[k]) {
    delete V[k]._variant;
    delete V[k]._useOriginal;
  }
  delete q._variant;
  delete q._useOriginal;
  save();
  show();
}

function mockBlueprint(half) {
  const b = {};
  if (half) {
    b['Basic Mathematics: Calculus & Functions'] = 5;

    b['Basic Statistics'] = 2;
    MOCK_COMPUTING_SUBJECTS.forEach(s => { b[s] = 2; });

    MOCK_COMPUTING_SUBJECTS.forEach(s => { b[s] = 5; });
  }
  return b;
}

function localWeekKey(ts = Date.now()) {
  const dayIdx = localDayIndex(ts);
  const d = new Date(ts);
  const offset = (d.getDay() + 6) % 7;
  return String(dayIdx - offset);
}

// Derive whether the current local week has a completed or resumable mock from WEEKLY_MOCK.
function weeklyMockStatus() {
  const currentWeek = localWeekKey();
  const lastWeek = WEEKLY_MOCK.lastCompletedWeek || '';
  const started = WEEKLY_MOCK.startedWeek === currentWeek && !!WEEKLY_MOCK.startedAt;
  return {
    currentWeek,
    completed: lastWeek === currentWeek,
    due: lastWeek !== currentWeek,
    started
  };
}

function mockPool(rawPool) {
  const seen = new Set();
  const out = [];
  (rawPool || []).forEach(q => {
    if (!q || isQuestionQuarantined(q) || isQuestionOutOfScope(q)) return;
    const id = questionUid(q) || qk(q);
    if (!id || seen.has(id)) return;
    seen.add(id);
    out.push(q);
  });
  return out;
}

function mockPoolStatus(pool, half) {
  const blueprint = mockBlueprint(half);
  const counts = {};
  pool.forEach(q => {
    const s = canonSubj(q.s);
    counts[s] = (counts[s] || 0) + 1;
  });
  const missing = Object.entries(blueprint)
    .filter(([s, need]) => (counts[s] || 0) < need)
    .map(([s, need]) => ({ subject: s, need, have: counts[s] || 0 }));
  return { ok: missing.length === 0, missing, blueprint };
}

function pickMockLevelQuestions(pool, quota) {
  const buckets = { 0: [], 1: [], 2: [], 3: [] };
  pool.forEach(q => {
    const lvl = Math.max(0, Math.min(3, effLevel(q)));
    buckets[lvl].push(q);
  });
  Object.values(buckets).forEach(bucket => bucket.sort(() => Math.random() - 0.5));
  const out = [];
  const take = (level, n) => {
    while (n > 0 && buckets[level].length) {
      out.push(buckets[level].pop());
      n--;
    }
  };
  const core0 = Math.round(quota * 0.4);
  const core1 = Math.round(quota * 0.4);
  take(0, core0);
  take(1, core1);
  take(2, quota - out.length);
  take(3, quota - out.length);
  [0, 1, 2, 3].forEach(level => {
    if (out.length < quota) take(level, quota - out.length);
  });
  return out.slice(0, quota);
}

function chooseMockSource(half) {
  const current = mockPool(D || []);
  const currentStatus = mockPoolStatus(current, half);
  if (currentStatus.ok) return { pool: current, source: 'current set' };

  const bank = mockPool(bankQuestionPool());
  const bankStatus = mockPoolStatus(bank, half);
  if (bankStatus.ok) return { pool: bank, source: 'saved question bank' };

  const best = bankStatus.missing.length <= currentStatus.missing.length ? bankStatus : currentStatus;
  const detail = best.missing
    .map(m => `• ${m.subject}: need ${m.need}, have ${m.have}`)
    .join('\n');
  alert(`Cannot build a ${half ? 'half' : 'full'} mock: the available questions do not cover the guide blueprint.\n\n${detail}\n\nLoad a larger question bank or restore your saved banks, then try again.`);
  return null;
}

function buildMockSnapshots(half) {
  const source = chooseMockSource(half);
  if (!source) return null;
  const grouped = {};
  source.pool.forEach(q => {
    const s = canonSubj(q.s);
    (grouped[s] = grouped[s] || []).push(q);
  });
  const blueprint = mockBlueprint(half);
  const orderedSubjects = [...MOCK_MATH_SUBJECTS, ...MOCK_COMPUTING_SUBJECTS];
  const selected = [];
  orderedSubjects.forEach(subject => {
    const quota = blueprint[subject] || 0;
    if (!quota) return;
    const picked = pickMockLevelQuestions(grouped[subject] || [], quota);
    selected.push(...picked);
  });
  if (selected.length !== (half ? 50 : 100)) {
    alert(`Mock assembly produced ${selected.length} questions instead of ${half ? 50 : 100}. Please try again or load a larger bank.`);
    return null;
  }
  const snapshots = selected.map((q, i) => {
    const copy = JSON.parse(JSON.stringify(q));
    copy.n = i + 1;
    copy._mockOrigUid = ensureQuestionUid(q);
    copy._mockOrigN = q.n;
    return copy;
  });
  return { snapshots, source: source.source };
}

// Build and start a timed mock from the exam blueprint with separate mock-session grading and persistence.
function mock(count = 100, isDiagnostic = false) {
  const half = count === 50;
  const built = buildMockSnapshots(half);
  if (!built) return;
  MOCK_D = built.snapshots;
  const k = MOCK_D.map(q => q.n);
  const durationMin = half ? 60 : 120;
  const durationMs = durationMin * 60000;
  const now = Date.now();

  MK = {
    a: {},
    displayA: {},
    flagged: {},
    n: k.length,
    start: now,
    end: now + durationMs,
    remainingMs: durationMs,
    paused: false,
    expired: false,
    isDiagnostic: !!isDiagnostic,
    isHalf: half,
    durationMs,

function persistMockState() {

      MK,
      Q,
      P,

    }));
  } catch (e) {
    console.error('Failed to persist mock state:', e);

}

function resumeActiveMock() {

    if (!rawMock) return;
    const parsed = JSON.parse(rawMock);
    MK = parsed.MK;
    if (!MK) return;

function toggleFlag() {
  if (!MK || MK.expired) return;

function togglePause() {
  if (!MK || MK.expired) return;
  if (MK.paused) {
    MK.paused = false;
    MK.end = Date.now() + (MK.remainingMs || 0);
    MK_PAUSED = false;
    MK_REM = 0;
    TI = setInterval(tick, 1000);
    tick();
  } else {
    MK.remainingMs = Math.max(0, MK.end - Date.now());
    MK.paused = true;
    MK_PAUSED = true;
    MK_REM = MK.remainingMs;
    clearInterval(TI);
  }
  persistMockState();
  show();
}

function expireMock() {
  if (!MK || MK.expired) return;
  MK.remainingMs = 0;
  MK.end = Date.now();
  MK.paused = false;
  MK.expired = true;
  MK_PAUSED = false;
  MK_REM = 0;

  persistMockState();

function tick() {
  if (!MK || MK.paused || MK.expired) return;
  const r = Math.max(0, MK.end - Date.now());

      </table>

document.addEventListener('keydown', e => {
  if (/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (document.getElementById('q-editor-overlay')) return;
  if (view === 'q' && e.altKey && e.key.toLowerCase() === 'c') {
    e.preventDefault();
    toggleCalcPanel();

  }
  if (view !== 'q' || e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key.toLowerCase();

  // Navigation shortcuts
  if (k === 'b') {
    e.preventDefault();
    navBack();
    return;
  }
  if (k === 'n') {
    e.preventDefault();
    navForward();
    return;
  }
  if (k === 'f' && MK) {
    e.preventDefault();
    toggleFlag();
    return;
  }

  if (recallWaiting) {
    revealRecallOptions();
    if (k === 's') {
      dontKnow();

  }

  if (!locked) {

      if (MK) toggleFlag();

      return;
    }
    const i = 'abcd'.indexOf(k);
    const j = '1234'.indexOf(k);

  }
