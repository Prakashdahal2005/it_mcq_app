const $ = s => document.querySelector(s);
const KEY = 'bitmcq1';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// Core State
let D = null, R = {}, W = {}, Q = [], P = 0, S = 1, A = [], loadMode = 0, FOC = [], L = [], V = {}, ET = -1, RA = new Set(), MK = null, TI = 0, REV = null, locked = false, view = 'home', tab = 'w', BANKS = [], SETBANK = null, SETI = -1, impMode = 0, AUTO_ADVANCE_TIMER = null;
let EXAM_DATE = '';
let lastBackup = 0;
let gemVars = [];
let QOV = {};
let gemLast = 0;
let genInProgress = false;
let GEM_KEY = localStorage.getItem('bitmcq_gem') || '';
let GEM_MODEL = 'gemini-3.8-flash';
let sessionLeechCount = 0;
let recallWaiting = false;
let recallFirst = true;
let CURRENT_Q = null;
let todayMins = 15;
let showMoreMenu = false;
let bgGenQueue = [];
let bgGenStatusText = '';

function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({
      D, R, W, Q, P, S, A, L, V, BANKS, SETBANK, SETI, EXAM_DATE, lastBackup, gemVars, todayMins, QOV, recallFirst
    }));
  } catch (e) {
    console.error('Save failed:', e);
  }
  try { if (window.DriveSync) window.DriveSync.onLocalSave(); } catch (e) {}
}

function restoreBanks(s) {
  BANKS = Array.isArray(s.BANKS) ? s.BANKS : (s.BK && Array.isArray(s.SETS) ? [{ id: 1, name: 'Question bank 1', q: s.BK.q, sets: s.SETS }] : []);
  SETI = typeof s.SETI === 'number' ? s.SETI : -1;
  SETBANK = typeof s.SETBANK === 'number' ? s.SETBANK : (SETI >= 0 && BANKS.length ? BANKS[0].id : null);
  if (BANKS.length) A = A.map(a => a.bi != null && a.bankId == null ? { ...a, bankId: BANKS[0].id } : a);
}

function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s) {
      D = s.D || null;
      R = s.R || {};
      W = s.W || {};
      Q = s.Q || [];
      P = s.P || 0;
      S = s.S || 1;
      A = s.A || [];
      L = s.L || [];
      V = s.V || {};
      EXAM_DATE = s.EXAM_DATE || '';
      lastBackup = s.lastBackup || 0;
      gemVars = Array.isArray(s.gemVars) ? s.gemVars : [];
      todayMins = s.todayMins || 15;
      QOV = (s.QOV && typeof s.QOV === 'object') ? s.QOV : {};
      recallFirst = s.recallFirst !== false;
      restoreBanks(s);
      return true;
    }
  } catch (e) {
    console.error('Load failed:', e);
  }
  return false;
}

// Built-in Practice Set: Level 1 (80 Questions)
const LV1 = `# MIT Entrance: Curated 80-Question Practice Set (Part I Level, Trap-Dense)

**Built on:** the 16 subjects and units of Part II only. 5 Qs per subject, shifted to 6 for **C, DSA, OS** (where marks leak) and 4 for **IIT, MIS, EC** (cheapest marks). No question is copied from your 160 or from the official Part I (a few revisit a concept from a new angle). Every trace and calculation answer was verified by running code.

**Difficulty:** Part I wording (one-line stems, one fact or one small step) but with **adjacent-concept distractors**. Slightly harder than Part I on purpose, because the distractors are adjacent concepts. If you reach **64+/80 (80%)** under time, you are on track for the 75% goal.

---

## A. Questions

### Introduction to IT (BIT101)

**Q1.** *(U4)* Which of the following four numbers has the greatest value?

- A) 11111 (binary)
- B) 1E (hexadecimal)

- D) 35 (octal)

**Q2.** *(U7)* Which security mechanism lets a receiver verify who sent a message and that it was not altered, so the sender cannot later deny sending it?

- A) Firewall

**Q3.** *(U6)* Which pair is correctly matched?

- A) Data warehouse – discovering hidden patterns in large data sets

- D) Data mining – integrated, historical data store used for analysis

**Q4.** *(U3)* Which of the following is system software?

**Q5.** *(U4)* What is the output?

\`\`\`c

  if (/[;{}]/.test(t) && /[=+\-*/<>%!&|]/.test(t)) return true;

function getMaxInterval() {

  if (daysLeft <= 2) return 1;
  if (daysLeft <= 10) return 2;
  return Math.max(1, Math.round(daysLeft * 0.22)); // Cap at 20-25% of days left
}

function isLockedIn(q) {
  const v = V[qk(q)];
  if (!v || !Array.isArray(v.history) || v.history.length < 2) return false;
  const correctHits = [];
  for (const h of v.history) {
    if (!h.ok) {
      correctHits.length = 0;
    } else {
      correctHits.push(h.t);
    }
  }
  if (correctHits.length < 2) return false;
  for (let i = 0; i < correctHits.length - 1; i++) {
    for (let j = i + 1; j < correctHits.length; j++) {
      if (correctHits[j] - correctHits[i] >= 3 * 864e5) return true;
    }
  }
  return false;
}

function sr(q, ok) {
  const k = qk(q);
  const v = V[k] || (V[k] = { b: 0, d: 0, f: 0, history: [], missCount: 0 });
  if (!Array.isArray(v.history)) v.history = [];
  if (!v.f) v.f = Date.now();
  v.history.push({ t: Date.now(), ok });

  if (!ok) {
    v.b = 0;
    v.missCount = (v.missCount || 0) + 1;
    v.d = today() + 1;
    if (v.missCount >= 3) {
      v.leech = true;
    }
  } else {
    v.missCount = 0;
    v.b = Math.min((v.b || 0) + 1, 4);
    const ladder = [1, 3, 7, 14];
    v.d = today() + Math.min(ladder[v.b - 1] || 1, getMaxInterval());
  }
}

function dueKeys(quickOnly = false) {
  const t = today();

  const daysLeft = getDaysLeft();

  (D || []).forEach(q => {

    const v = V[qk(q)];
    if (v) {

  if (daysLeft <= 10 && ks.length < 25) {
    (D || []).forEach(q => {
      if (quickOnly && !effQuick(q)) return;
      if (!isLockedIn(q) && !ks.includes(q.n) && V[qk(q)]) {

  A.forEach((a, i) => a.errs.forEach((e, j) => {

function prepareQuestionForDisplay(rawQ) {
  // If a verified alternate variant exists and user hasn't explicitly toggled to original, present the variant
  const activeSource = (rawQ._variant && !rawQ._useOriginal) ? rawQ._variant : rawQ;

  const origOpts = (activeSource.o || []).slice();
  const rawAnsIndex = activeSource.a !== undefined ? activeSource.a : 0;
  const correctText = origOpts[rawAnsIndex];

  const isPinned = origOpts.map(opt => {
    const s = String(opt || '').trim().toLowerCase();
    return /^(all\s+of\s+the\s+above|none\s+of\s+the\s+above|both\s+[\(]?[a-d][\)]?\s*(and|&)\s*[\(]?[a-d][\)]?|all\s+these|none\s+these|all\s+of\s+these|none\s+of\s+these)/i.test(s);
  });

  const unpinnedIndices = [];
  origOpts.forEach((opt, idx) => {
    if (!isPinned[idx]) unpinnedIndices.push(idx);
  });

  const shuffledUnpinned = unpinnedIndices.slice().sort(() => Math.random() - 0.5);

  const displayOpts = new Array(origOpts.length);

  for (let i = 0; i < origOpts.length; i++) {

    q: activeSource.q,
    code: activeSource.code,
    e: activeSource.e,
    origQ: rawQ,
    origO: origOpts,

// Probabilistic Spaced Session Construction
function buildTodaySession(minutes = 15, quickOnly = false) {
  if (!D || !D.length) return [];
  const targetQ = Math.max(10, Math.round(minutes * 60 / 50));
  const pool = quickOnly ? (D || []).filter(q => effQuick(q)) : (D || []);
  if (!pool.length) return [];

  const due = dueKeys(quickOnly);
  const lockedSet = new Set(pool.filter(q => isLockedIn(q)).map(q => q.n));

  // Include previously answered questions to reinforce retained knowledge.
  const sureWins = pool.filter(q => {
    const v = V[qk(q)];
    return v && (v.history || []).some(h => h.ok) && !due.includes(q.n);
  }).map(q => q.n).sort(() => Math.random() - 0.5);

  // 2. Identify Weakest Subject (Calibrated with >= 8 attempts)
  const subjMap = agg();
  const qualifiedWeak = Object.entries(subjMap)
    .filter(([k, o]) => (o.c + o.w + o.k) >= 8 && (o.c / (o.c + o.w + o.k)) < 0.60)
    .sort((a, b) => (a[1].c / (a[1].c + a[1].w + a[1].k)) - (b[1].c / (b[1].c + b[1].w + b[1].k)));

  const weakestSubjName = qualifiedWeak.length ? qualifiedWeak[0][0] : null;
  const weakItems = weakestSubjName ? pool.filter(q => cl(q.s) === weakestSubjName && !lockedSet.has(q.n)).map(q => q.n) : [];

  // 3. Fresh unattempted items
  const unseenItems = pool.filter(q => !V[qk(q)]).map(q => q.n).sort(() => Math.random() - 0.5);

  const session = [];
  const added = new Set();
  function add(n) {
    if (n != null && !added.has(n)) {
      added.add(n);
      session.push(n);
      return true;
    }
    return false;
  }

  // Include up to two previously answered questions.
  for (let i = 0; i < 2 && sureWins.length; i++) add(sureWins.pop());

  // Due items (probabilistically weighted, max 3 leeches per session to avoid burnout)
  let leechCountInSession = 0;
  const shuffledDue = due.slice().sort(() => Math.random() - 0.5);
  while (shuffledDue.length && session.length < targetQ - 4) {
    const candidateN = shuffledDue.pop();
    const candQ = byN(candidateN);
    const v = candQ ? V[qk(candQ)] : null;
    const isLeech = v && v.missCount >= 3;
    if (isLeech) {
      if (leechCountInSession >= 3) continue; // Allow at most 3 leeches per session
      leechCountInSession++;
    }
    add(candidateN);
  }

  // Weakest subject items
  const shuffledWeak = weakItems.slice().sort(() => Math.random() - 0.5);
  for (let i = 0; i < 3 && shuffledWeak.length && session.length < targetQ - 2; i++) {
    add(shuffledWeak.pop());
  }

  // Fresh items
  while (unseenItems.length && session.length < targetQ - 1) {
    add(unseenItems.pop());
  }

  // Remaining filler
  const remainingAll = pool.map(q => q.n).sort(() => Math.random() - 0.5);
  for (const n of remainingAll) {
    if (session.length >= targetQ) break;
    add(n);
  }

  return groupQuestionBlocks(session);
}

// Honest Readiness Meter
function agg() {
  const m = {}, add = (k, c, w, x) => {
    const canonKey = canonSubj(k);
    const o = m[canonKey] || (m[canonKey] = { c: 0, w: 0, k: 0, h: [] });
    o.c += c; o.w += w; o.k += x;
    if (c + w + x) o.h.push(c / (c + w + x));
  };
  A.forEach(a => Object.entries(a.subj || {}).forEach(([k, v]) => add(k, v[0], v[1], v[2])));

    const k = canonSubj(q.s), v = cur[k] || (cur[k] = [0, 0, 0]), r = R[q.n];
    if (r === 'c') v[0]++;
    else if (r === 'w') v[1]++;
    else if (r === 's') v[2]++;
  });
  Object.entries(cur).forEach(([k, v]) => add(k, ...v));
  return m;
}

    .filter(([k, o]) => (o.c + o.w + o.k) > 0)
    .map(([k, o]) => {
      const tot = o.c + o.w + o.k;
      const acc = tot ? o.c / tot : 0;
      const isCalibrated = tot >= 8;
      const gap = acc - 0.75;
      return { k, tot, c: o.c, acc, isCalibrated, gap };
    }).sort((a, b) => {
      const priority = r => {
        if (r.isCalibrated && r.acc < 0.60) return 1; // Needs focus at the top
        if (r.isCalibrated && r.acc < 0.75) return 2; // Getting there
        if (!r.isCalibrated) return 3;                // Calibrating in progress
        return 4;                                     // On target
      };
      return priority(a) - priority(b) || a.acc - b.acc || b.tot - a.tot;
    });
  const calibratedRows = rows.filter(r => r.isCalibrated);

  // Base readiness strictly on First-Attempt Accuracy + Timed Mock performance
  // Never inflate with repeated memory practice!
  const mockAttempts = L.filter(r => r.mock === 1);
  const mockOk = mockAttempts.filter(r => r.ok).length;
  const mockTot = mockAttempts.length;
  const mockAcc = mockTot >= 10 ? (mockOk / mockTot) : null;

  const fsAcc = fsTot ? (fsOk / fsTot) : 0;
  
  let projectedAcc = fsAcc;
  if (mockAcc !== null && fsTot >= 10) {
    // 60% weight on full timed mock performance, 40% on first-attempt accuracy across all sets
    projectedAcc = (mockAcc * 0.60) + (fsAcc * 0.40);
  } else if (mockAcc !== null) {
    projectedAcc = mockAcc;
  } else if (!fsTot && calibratedRows.length) {
    projectedAcc = calibratedRows.reduce((sum, r) => sum + r.acc, 0) / calibratedRows.length;
  }

  const projectedMark = Math.round(projectedAcc * 1000) / 10;
  const markGap = Math.round((projectedMark - 75) * 10) / 10;

  // Track any subjects in active D that haven't been touched yet
  const activeDeckSubjs = new Set((D || []).map(q => canonSubj(q.s)));
  const unattemptedInDeck = [...activeDeckSubjs].filter(s => {
    const o = subjData[s];
    return !o || (o.c + o.w + o.k) === 0;
  });

  return `
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">📊 Honest Readiness Meter</h2>
      <span class="chip ${projectedMark >= 75 ? 'c-ok' : 'c-no'}">
        Target: 75% | Projected: <b>${projectedMark}%</b> (${markGap >= 0 ? '+' : ''}${markGap} marks)
      </span>
    </div>
    <p class="mu" style="margin:6px 0 14px">Based on calibrated subjects (≥8 attempts) &amp; first-attempt accuracy. Repeat accuracy is memory-inflated.</p>
    
    <div class="row" style="margin-bottom:14px">
      <span class="chip">🔒 Locked in: <b>${lockedCount}/${D.length}</b> (${lockedPct}%)</span>
      <span class="chip">🎯 First-attempt signal: <b>${fsTot ? Math.round(fsOk / fsTot * 100) : 0}%</b> (${fsOk}/${fsTot})</span>
      <span class="chip mu">Repeat memory: ${rpTot ? Math.round(rpOk / rpTot * 100) : 0}% (${rpOk}/${rpTot})</span>
    </div>

    <table class="tbl">
      <thead>
        <tr>
          <th>Subject</th>
          <th>Attempts</th>
          <th>Accuracy</th>
          <th>Gap to 75%</th>
          <th>Diagnostic Status</th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r => {
          let statusBadge = '';
          if (!r.isCalibrated) {
            statusBadge = `<span class="mu sm">Calibrating (${r.tot}/8)</span>`;
          } else if (r.acc >= 0.75) {
            statusBadge = `<span class="c-ok sm" style="font-weight:600">✓ On target</span>`;
          } else if (r.acc < 0.60) {
            statusBadge = `<span class="c-no sm" style="font-weight:600">⚠ Needs focus</span>`;
          } else {
            statusBadge = `<span class="c-sk sm">Getting there</span>`;
          }
          return `
            <tr>
              <td><b>${esc(r.k)}</b></td>
              <td>${r.tot}</td>
              <td>${r.tot ? Math.round(r.acc * 100) + '%' : '–'}</td>
              <td class="${r.gap >= 0 ? 'c-ok' : 'c-no'}">${r.isCalibrated ? (r.gap >= 0 ? '+' : '') + Math.round(r.gap * 100) + '%' : '–'}</td>
              <td>${statusBadge}</td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
    ${unattemptedInDeck.length ? `<p class="mu sm" style="margin-top:10px">📚 <b>Not yet attempted in active deck:</b> ${unattemptedInDeck.map(s => esc(s)).join(' · ')}</p>` : ''}
  </div>
  `;
}

function renderOptionsHtml(q) {
  return q.displayOpts.map((o, i) => `

      <b>${'ABCD'[i]}</b><span>${esc(o)}</span>
    </button>
  `).join('');
}

function renderQuestionStem(stem) {
  const text = String(stem || '');
  const fence = /```(?:(?:c|cpp|c\+\+)(?=[ \t]|\r?\n))?[ \t]*\r?\n?([\s\S]*?)```/gi;
  let html = '', lastIndex = 0, match;

  while ((match = fence.exec(text))) {
    html += hl(esc(text.slice(lastIndex, match.index)));
    const code = match[1].replace(/^\r?\n/, '').replace(/\r?\n$/, '').replace(/[ \t]+$/, '');
    html += `<pre>${esc(code)}</pre>`;
    lastIndex = fence.lastIndex;
  }

  return html + hl(esc(text.slice(lastIndex)));
}

let REC = null;

function pick(i) {
  if (locked) return;
  if (recallWaiting) revealRecallOptions();

  const rawQ = CURRENT_Q.origQ || byN(Q[P]);

  if (MK) {
    MK.a[CURRENT_Q.origQ.n] = i;
    next();
    return;
  }

  locked = true;
  const k = rawQ._k || rawQ.n;
  const ok = (i === CURRENT_Q.displayA);
  const origPickedIndex = CURRENT_Q.origO.indexOf(CURRENT_Q.displayOpts[i]);

  const bs = [...document.querySelectorAll('.opt')];
  bs.forEach(b => b.disabled = true);
  const dk = $('#dontknow-btn');
  if (dk) dk.disabled = true;

  REC = {
    k: qk(rawQ),
    t: Date.now(),
    s: cl(rawQ.s),
    u: rawQ.u || '',
    q: rawQ.q.slice(0, 120),
    ch: origPickedIndex,
    ok,
    set: S
  };
  L.push(REC);
  sr(rawQ, ok);

  if (ok) {
    if (rawQ._k) mark(rawQ._k, 1, origPickedIndex);
    else { R[rawQ.n] = 'c'; delete W[rawQ.n]; }
    bs[i].classList.add('ok');
    $('#fb').innerHTML = `
      <div class="exp">
        <b class="c-ok">Correct.</b>
        ${explanationHtml(rawQ.e)}
      </div>
      <p class="row" style="margin-top:12px"><button class="p" id="nx" onclick="fin()">Continue → (Enter)</button></p>
    `;
    save();
    AUTO_ADVANCE_TIMER = setTimeout(() => {
      AUTO_ADVANCE_TIMER = null;
      fin();
    }, 500);
  } else {
    // Wrong Answer
    if (rawQ._k) mark(rawQ._k, 0, origPickedIndex);
    else { R[rawQ.n] = 'w'; W[rawQ.n] = origPickedIndex; }
    bs[i].classList.add('no');
    if (bs[CURRENT_Q.displayA]) bs[CURRENT_Q.displayA].classList.add('ok');

    const v = V[qk(rawQ)];
    const isLeech = v && v.missCount >= 3;

    if (isLeech) {
      sessionLeechCount++;
      $('#fb').innerHTML = `
        <div class="exp leech">
          <b style="color:#d9480f">⚠️ Leech Item (Missed 3 times):</b> Parked until tomorrow to prevent burnout.
          <div style="margin-top:6px">Correct: <b>${'ABCD'[CURRENT_Q.displayA]}) ${esc(CURRENT_Q.displayOpts[CURRENT_Q.displayA])}</b></div>
          ${explanationHtml(rawQ.e)}
        </div>
        <p class="mu" style="margin:10px 0 4px">Write an own-words mnemonic or memory anchor (optional):</p>
        <input type="text" id="fx" placeholder="e.g. Deferred update means NO-UNDO on crash" onkeydown="if(event.key==='Enter')fin()">
        <p class="row" style="margin-top:12px"><button class="p" id="nx" onclick="fin()">Park &amp; Continue → (Enter)</button></p>
      `;
    } else {
      if (!RA.has(k)) {
        RA.add(k);
        insertRetryInSubjectBlock(k, rawQ.s);
      }
      $('#fb').innerHTML = `
        <div class="exp">
          <b class="c-no">Wrong.</b> Correct: <b>${'ABCD'[CURRENT_Q.displayA]}) ${esc(CURRENT_Q.displayOpts[CURRENT_Q.displayA])}</b>. Scheduled for tomorrow.
          ${explanationHtml(rawQ.e)}
        </div>
        <p class="mu" style="margin:10px 0 4px">Error category (optional, Enter to continue):</p>
        <div class="row">
          ${['Knowledge gap', 'Conceptual', 'Confusion', 'Careless'].map((n, x) => `<button class="et sm" aria-pressed="false" onclick="setEt(${x})">${n}</button>`).join('')}
        </div>
        <input type="text" id="fx" placeholder="Optional one-line fix: why did you pick that?" style="margin-top:8px" onkeydown="if(event.key==='Enter')fin()">
        <p class="row" style="margin-top:12px"><button class="p" id="nx" onclick="fin()">Continue → (Enter)</button></p>
      `;
    }
    save();
  }
}

function dontKnow() {
  if (locked) return;
  if (recallWaiting) revealRecallOptions();

// Background Question Mutation Engine: Creates safe concept variants for calc/trace questions
async function triggerBackgroundVariantUpgrades(sessionKeys) {
  if (!GEM_KEY) return;
  const candidates = [];
  const seenKeys = new Set();

  sessionKeys.forEach(k => {
    const q = byN(k);
    if (!q || seenKeys.has(qk(q))) return;
    
    // Safety Rule 1: ONLY rewrite calculation, code, or trace items. Factual items are NEVER rewritten.
    const isCalcOrTrace = !effQuick(q) || (q.code && q.code.length > 0) || (q.t && /[CTP]/i.test(q.t));
    if (!isCalcOrTrace) return;

    const lastAttempt = [...L].reverse().find(l => l.k === qk(q));
    if (!lastAttempt) return;
    if (!lastAttempt.ok) {
      seenKeys.add(qk(q));
      candidates.push(q);
    }
  });

  if (!candidates.length) return;
  const topCandidates = candidates.slice(0, 3); // Stagger up to 3 calc concepts per set

  const bgBox = $('#bg-gen-box');
  if (bgBox) {
    bgBox.style.display = 'flex';
    bgBox.innerHTML = `<span>✨ Background: Generating verified math/trace variants with dual-blind validation for ${topCandidates.length} question(s)...</span>`;
  }

  topCandidates.forEach((q, idx) => {
    setTimeout(() => {
      rewriteQuestionWithGemini(q);
    }, idx * 4000);
  });
}

const MATH_PROMPT = 'You are an expert STEM exam writer. Solve the ORIGINAL question step by step, then create ONE new variant with DIFFERENT numbers/variables preserving the identical method. Return 4 plausible choices and the exact 0-indexed answer. Return ONLY valid JSON: {"subject":"string","stem":"string","code":["string"],"options":["a","b","c","d"],"answer":0,"why":"string"}';
const BLIND_SOLVE_PROMPT = 'Solve this multiple choice question step by step. Identify the single correct option index (0 for A, 1 for B, 2 for C, 3 for D). Return ONLY valid JSON: {"answer":0,"why":"string"}';

async function rewriteQuestionWithGemini(targetQ) {
  try {
    const source = {
      subject: targetQ.s,
      unit: targetQ.u || '',
      stem: targetQ.q,
      code: targetQ.code || [],
      options: targetQ.o,
      answer: targetQ.a,
      why: targetQ.e || ''
    };

    // Step 1: Generate variant
    const payloadGen = {
      contents: [{
        parts: [{
          text: MATH_PROMPT + '\n\nOriginal Question:\n' + JSON.stringify(source)
        }]
      }]
    };

    const resGen = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEM_MODEL}:generateContent?key=${GEM_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payloadGen)
    });
    const jGen = await resGen.json();
    const txtGen = jGen.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!txtGen) return;

    const cleanGen = txtGen.replace(/```json/g, '').replace(/```/g, '').trim();
    const v = JSON.parse(cleanGen);
    if (!v.stem || !Array.isArray(v.options) || v.options.length !== 4 || typeof v.answer !== 'number') return;

    // Step 2: Blind Second Solve Validation (Pass only the variant stem & options without revealing intended answer)
    const blindPayload = {
      contents: [{
        parts: [{
          text: BLIND_SOLVE_PROMPT + '\n\nSolve this question:\n' + JSON.stringify({
            stem: v.stem,
            code: v.code || [],
            options: v.options
          })
        }]
      }]
    };

    const resBlind = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${GEM_MODEL}:generateContent?key=${GEM_KEY}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(blindPayload)
    });
    const jBlind = await resBlind.json();
    const txtBlind = jBlind.candidates?.[0]?.content?.parts?.[0]?.text;
    if (!txtBlind) return;

    const cleanBlind = txtBlind.replace(/```json/g, '').replace(/```/g, '').trim();
    const blindResult = JSON.parse(cleanBlind);

    // Strict Agreement Check: only accept if blind second solve yields the identical answer
    if (blindResult.answer !== v.answer) {
      console.warn(`[AI Variant Discarded] Blind solve mismatch for Q${targetQ.n}: Gen=${v.answer}, Blind=${blindResult.answer}`);
      return;
    }

    // Safety Rule 2: NEVER overwrite original. Store as alternate variant object.
    targetQ._variant = {
      q: String(v.stem),
      o: v.options.map(String),
      a: v.answer,
      e: v.why || targetQ.e || '',
      code: Array.isArray(v.code) ? v.code.map(String) : [],
      date: Date.now()
    };
    save();

    const bgBox = $('#bg-gen-box');
    if (bgBox) {
      bgBox.innerHTML = `<span>✓ Q${targetQ.n} (${esc(targetQ.s)}): Verified variant saved as alternate (original safe).</span>`;
    }
  } catch (err) {
    console.warn('Auto variant validation error:', err);
  }
}

// Timed Mock Exam Fix
let MK_PAUSED = false, MK_REM = 0;

function mock() {
  const by = {};
  D.forEach(q => (by[cl(q.s)] = by[cl(q.s)] || []).push(q.n));
  const ks = [];
  Object.values(by).forEach(g => {
    g.sort(() => Math.random() - .5);
    ks.push(...g.slice(0, 5));
  });
  ks.sort(() => Math.random() - .5);
  const k = ks.slice(0, 100);
  if (!k.length) return;

  MK = {
    a: {},
    flagged: {},
    n: k.length,
    end: Date.now() + k.length * 60000
  };
  MK_PAUSED = false;
  MK_REM = 0;
  start(k);
}

function toggleFlag() {
  if (!MK) return;
  const rawQ = CURRENT_Q.origQ || byN(Q[P]);
  MK.flagged = MK.flagged || {};
  MK.flagged[rawQ.n] = !MK.flagged[rawQ.n];
  const b = $('#flag-btn');
  if (b) b.classList.toggle('p', !!MK.flagged[rawQ.n]);
  const btn = document.getElementById('pal-' + P);
  if (btn) btn.classList.toggle('flg', !!MK.flagged[rawQ.n]);
}

function togglePause() {
  if (!MK) return;
  MK_PAUSED = !MK_PAUSED;
  if (MK_PAUSED) {
    MK_REM = MK.end - Date.now();
    clearInterval(TI);
  } else {
    MK.end = Date.now() + MK_REM;
    TI = setInterval(tick, 1000);
    tick();
  }
  const pb = $('#pb');
  if (pb) pb.textContent = MK_PAUSED ? '▶ Resume' : '⏸ Pause';
}

function tick() {
  if (!MK || MK_PAUSED) return;
  const r = Math.max(0, MK.end - Date.now());
  const tm = $('#tm');
  if (tm) tm.textContent = '⏱ ' + Math.floor(r / 6e4) + ':' + String(Math.floor(r / 1e3) % 60).padStart(2, '0');
  
  const unans = Q.filter(n => MK.a[byN(n).n] === undefined).length;
  const uc = $('#unans-chip');
  if (uc) uc.textContent = unans ? `Unanswered: ${unans}` : 'All answered ✓';

  if (!r) mockEnd();
}

  }
});

// Import & Bank Handling
function tpl() { $('#t').value = TPL; }

function doLoad() {
  try {
    const t = $('#t').value.trim();
    if (!t) throw new Error('Nothing to load yet.');
    let x = null;
    if (/^\s*[\[{]/.test(t)) {
      try { x = JSON.parse(t); } catch (e) {
        if (impMode === 1) throw new Error('Bank import expects valid JSON.');
      }
    }
    const bank = !!x && !Array.isArray(x) && Array.isArray(x.subjects);
    if (impMode === 1 && !bank) throw new Error('Not a question-bank file. Expected JSON shaped like {"subjects":[...]}.');
    if (bank) {
      const r = parseBank(x), id = BANKS.reduce((n, b) => Math.max(n, b.id), 0) + 1;
      BANKS.push({ id, name: x.name || x.title || `Question bank ${id}`, q: r.qs, sets: genSets(r.qs) });
      loadMode = 0; impMode = 0;
      if (!D) loadSet(id, 0); else { save(); home(); }
      return;
    }
    const nd = parse(t);
    if (D && Object.keys(R).length) { A.push(compact()); S = A.length + 1; }
    else S = A.length + 1;
    D = nd; R = {}; W = {}; Q = []; P = 0; SETBANK = null; SETI = -1; loadMode = 0;
    save(); home();
  } catch (e) {
    $('#err').textContent = e.message;
  }
}

function loadSet(bankId, k) {
  const bank = BANKS.find(b => b.id === bankId);
  if (!bank || !bank.sets[k]) return;
  if (D && Object.keys(R).length) { A.push(compact()); S = A.length + 1; }
  else S = A.length + 1;
  SETBANK = bankId; SETI = k;
  D = bank.sets[k].map((ix, j) => ({ n: j + 1, ...bank.q[ix] }));
  R = {}; W = {}; Q = []; P = 0; loadMode = 0; impMode = 0;
  save(); home();
}

function compact() {
  const subj = {};
  (D || []).forEach(q => {
    const k = cl(q.s), v = subj[k] || (subj[k] = [0, 0, 0, 0]);
    v[3]++;
    const r = R[q.n];
    if (r === 'c') v[0]++;
    else if (r === 'w') v[1]++;
    else if (r === 's') v[2]++;
  });
  return {
    no: S,
    date: new Date().toISOString().slice(0, 10),
    total: D.length,
    subj,
    ...(SETBANK !== null && SETI >= 0 ? { bankId: SETBANK, bi: SETI } : {}),
    errs: D.filter(q => R[q.n] === 'w' || R[q.n] === 's').map(q => ({
      n: q.n, s: q.s, q: q.q, code: q.code, o: q.o, a: q.a, e: q.e, p: W[q.n] ?? -1, r: R[q.n], fx: 0,
      quick: effQuick(q), _orig: q._orig
    }))
  };
}

function retake() {
  if (!Object.keys(R).length) return;
  if (confirm('Archive this attempt and restart this set fresh?')) {
    A.push(compact());
    S = A.length + 1;
    R = {}; W = {}; Q = []; P = 0;
    save(); home();
  }
}

// Backup & Persistence
function saveFile(name, text, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: mime || 'text/plain' }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

function backup() {
  lastBackup = Date.now();
  save();
  const data = JSON.stringify({ D, R, W, Q, P, S, A, L, V, BANKS, SETBANK, SETI, EXAM_DATE, lastBackup, gemVars, todayMins });
  saveFile('bitmcq-progress-backup.json', data, 'application/json');
  home();
}

function restore(f) {
  if (!f || !confirm('Restore backup? This replaces current progress.')) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(r.result);
      const x = (parsed && parsed.appState && typeof parsed.appState === 'object') ? parsed.appState : parsed;
      D = x.D || null; R = x.R || {}; W = x.W || {}; Q = x.Q || []; P = x.P || 0;
      S = x.S || 1; A = x.A || []; L = x.L || []; V = x.V || {};
      EXAM_DATE = x.EXAM_DATE || ''; lastBackup = x.lastBackup || Date.now();
      gemVars = Array.isArray(x.gemVars) ? x.gemVars : [];
      restoreBanks(x);
      loadMode = 0; save(); home();
    } catch (e) {
      alert('Invalid backup file.');
    }
  };
  r.readAsText(f);
}

      <input type="date" id="ed" value="${EXAM_DATE || ''}" style="margin-top:6px;width:100%">
      
      <label class="mu" style="margin-top:14px;display:block">Gemini API Key (for auto-rewriting weak questions into fresh variants)</label>
      <input type="password" id="gk" value="${esc(GEM_KEY)}" placeholder="Paste AI Studio Key" style="margin-top:6px;width:100%">
      <p class="mu sm">When set, questions you miss or hesitate on are automatically upgraded in the background into fresh variants with different numbers/variables so you never learn by answer position memory.</p>

      <p class="row" style="margin-top:18px">
        <button class="p" onclick="saveSettings()">Save Settings</button>
        <button onclick="home()">Cancel</button>
      </p>
    </div>
    ${window.DriveSync ? DriveSync.settingsHTML() : ''}
  `;
}

function saveSettings() {
  EXAM_DATE = $('#ed').value;
  GEM_KEY = $('#gk').value.trim();
  localStorage.setItem('bitmcq_gem', GEM_KEY);
  save();
  home();
}

// Initialization
window.AppState = {
  get: () => ({ D, R, W, Q, P, S, A, L, V, BANKS, SETBANK, SETI, EXAM_DATE, lastBackup, gemVars, todayMins, QOV }),
  apply: (s) => {
    const wasQ = (typeof view !== 'undefined' && view === 'q');
    const prevP = P;
    const prevKey = (wasQ && Array.isArray(Q) && typeof P === 'number' && Q[P] != null) ? Q[P] : null;
    D = s.D == null ? null : s.D;
    R = s.R || {}; W = s.W || {}; Q = s.Q || []; P = s.P || 0;
    S = s.S || 1; A = s.A || []; L = s.L || []; V = s.V || {};
    BANKS = Array.isArray(s.BANKS) ? s.BANKS : [];
    SETBANK = typeof s.SETBANK === 'number' ? s.SETBANK : null;
    SETI = typeof s.SETI === 'number' ? s.SETI : -1;
    EXAM_DATE = s.EXAM_DATE || '';
    lastBackup = s.lastBackup || 0;
    gemVars = Array.isArray(s.gemVars) ? s.gemVars : [];
    todayMins = typeof s.todayMins === 'number' ? s.todayMins : 15;
    QOV = (s.QOV && typeof s.QOV === 'object') ? s.QOV : {};
    save();
    if (window.DriveSync) DriveSync.refreshUI();
    if (wasQ) {
      const nowKey = (Array.isArray(Q) && typeof P === 'number' && P >= 0 && Q[P] != null) ? Q[P] : null;
      if (nowKey !== prevKey || P !== prevP) {
        try { if (typeof show === 'function') show(); } catch (e) {}
      }
      return;
    }
    if (document.getElementById('ed')) return;
    home();
  },
  save: save,
  home: home,
  genSets: genSets
};

load();
home();
if (window.DriveSync) DriveSync.init();
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
