<style>

:root[data-theme="dark"]{--bg:#161615;--card:#201f1d;--tx:#ecebe6;--mu:#9b9a92;--bd:#34332f;--ac:#7c97ff;--ok:#69db7c;--okb:#17301c;--no:#ff8787;--nob:#3a1b1b;--sk:#ffa94d;--skb:#3a2a12;--code:#2a2926}

const $=s=>document.querySelector(s),KEY='bitmcq1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let D=null,R={},W={},Q=[],P=0,S=1,A=[],loadMode=0,FOC=[],L=[],V={},CF=3,T0=0,ET=-1,RA=new Set(),MK=null,TI=0,REV=null,locked=false,view='home',tab='w',BANKS=[],SETBANK=null,SETI=-1,impMode=0;

function save(){try{localStorage.setItem(KEY,JSON.stringify({D,R,W,Q,P,S,A,L,V,BANKS,SETBANK,SETI}))}catch(e){}}
function restoreBanks(s){
  BANKS=Array.isArray(s.BANKS)?s.BANKS:(s.BK&&Array.isArray(s.SETS)?[{id:1,name:'Question bank 1',q:s.BK.q,sets:s.SETS}]:[]);
  SETI=typeof s.SETI==='number'?s.SETI:-1;
  SETBANK=typeof s.SETBANK==='number'?s.SETBANK:(SETI>=0&&BANKS.length?BANKS[0].id:null);
  if(BANKS.length)A=A.map(a=>a.bi!=null&&a.bankId==null?{...a,bankId:BANKS[0].id}:a);
}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){D=s.D||null;R=s.R||{};W=s.W||{};Q=s.Q||[];P=s.P||0;S=s.S||1;A=s.A||[];L=s.L||[];V=s.V||{};restoreBanks(s);return true}}catch(e){}return false}

const LV1="# MIT Entrance: Curated 80-Question Practice Set (Part I Level, Trap-Dense)\n\n**Built on:** the 16 subjects and units of Part II only. 5 Qs per subject, shifted to 6 for **C, DSA, OS** (where marks leak) and 4 for **IIT, MIS, EC** (cheapest marks). No question is copied from your 160 or from the official Part I (a few revisit a concept from a new angle). Every trace and calculation answer was verified by running code.\n\n**Difficulty:** Part I wording (one-line stems, one fact or one small step) but with **adjacent-concept distractors**. Slightly harder than Part I on purpose, because the distractors are adjacent concepts. If you reach **64+/80 (80%)** under time, you are on track for the 75% goal.\n\n---\n\n## How to take it\n\n1. **Closed book, timed: 75 minutes** (about 55 s per question). Phone away.\n2. Beside every answer write a **confidence: 1 = guess, 2 = think so, 3 = sure** on the answer sheet (section C).\n3. **Compute before looking** at the options on any `C` question. The options are built from the common slip results.\n4. On `N` questions, underline NOT / FALSE / INCORRECT in the stem before reading the options.\n5. Don't open section B until you finish. Then use section D to diagnose.\n\n**Tag legend** (shown in the answer key, not next to the questions):\n\n| Tag | Trap type | | Tag | Trap type |\n|---|---|---|---|---|\n| S | sibling / look-alike concepts | | N | NOT / FALSE / INCORRECT stem |\n| P | precedence / order of operations | | A | All / Both of the above logic |\n| X | extra or misleading data | | C | compute first, then look |\n| T | trace by hand | | R | exact rule / fact |\n\n**Edge-of-syllabus notes** (the topic is listed, but the exact algorithm or example is textbook-standard): Q40 (deadlock minimum-units reasoning), Q41 (SSTF; the syllabus says only \"disk scheduling\"), Q49 (BPR as the radical method). If your notes lack them, treat them as bonus items.\n\n---\n\n## A. Questions\n\n### Introduction to IT (BIT101)\n\n**Q1.** *(U4)* Which of the following four numbers has the greatest value?\n\n- A) 11111 (binary)\n- B) 1E (hexadecimal)\n- C) 30 (decimal)\n- D) 35 (octal)\n\n**Q2.** *(U7)* Which security mechanism lets a receiver verify who sent a message and that it was not altered, so the sender cannot later deny sending it?\n\n- A) Firewall\n- B) Digital signature\n- C) Intrusion detection system\n- D) Symmetric-key encryption alone\n\n**Q3.** *(U6)* Which pair is correctly matched?\n\n- A) Data warehouse \u2013 discovering hidden patterns in large data sets\n- B) Big data \u2013 data small enough to be handled in a single spreadsheet\n- C) Data warehouse \u2013 integrated, historical data store used for analysis\n- D) Data mining \u2013 integrated, historical data store used for analysis\n\n**Q4.** *(U3)* Which of the following is system software?\n\n- A) Compiler\n- B) Device driver\n- C) Operating system\n- D) All of the above\n\n### C Programming (BIT102)\n\n**Q5.** *(U4)* What is the output?\n\n```c\nint x = 5, y = 3;\nprintf(\"%d\", x & y | x ^ y);\n```\n\n- A) 4\n- B) 1\n- C) 6\n- D) 7\n\n**Q6.** *(U5)* What is the output?\n\n```c\nint i, s = 0;\nfor (i = 0; i < 5; i++) {\n    if (i % 2) continue;\n    s += i;\n}\nprintf(\"%d %d\", s, i);\n```\n\n- A) 6 5\n- B) 6 4\n- C) 6 6\n- D) 4 5\n\n**Q7.** *(U9)* What is the output?\n\n```c\nint a[] = {1, 2, 3, 4};\nint *p = a + 1;\nprintf(\"%d %d\", p[1], *(p - 1) + 10);\n```\n\n- A) 3 2\n- B) 2 11\n- C) 4 11\n- D) 3 11\n\n**Q8.** *(U6)* What is the output? (the string contains an escape sequence)\n\n```c\nchar t[] = \"ab\\0cd\";\nprintf(\"%d %d\", (int)strlen(t), (int)sizeof(t));\n```\n\n- A) 2 6\n- B) 5 6\n- C) 2 5\n- D) 5 5\n\n**Q9.** *(U7)* What is the output?\n\n```c\nint f(void) { static int n = 0; n += 2; return n; }\nint main() { f(); f(); printf(\"%d\", f()); }\n```\n\n- A) 2\n- B) 3\n- C) 4\n- D) 6\n\n**Q10.** *(U8)* What is the output?\n\n```c\n#define MAX(a,b) (a)>(b)?(a):(b)\nprintf(\"%d\", 10 + MAX(2, 5));\n```\n\n- A) 5\n- B) 2\n- C) 12\n- D) 15\n\n### Digital Logic (BIT103)\n\n**Q11.** *(U1)* Using 4-bit 2's complement addition, 1010 \u2212 0111 gives:\n\n- A) 0111\n- B) 0011\n- C) 0010\n- D) 10011\n\n**Q12.** *(U2)* The complement of the function (A\u00b7B' + C) equals:\n\n- A) (A' + B)\u00b7C'\n- B) A'\u00b7B + C'\n- C) (A' + B')\u00b7C'\n- D) A' + B + C'\n\n**Q13.** *(U3)* The function F(A, B, C) = \u03a3m(0, 2, 4, 6). Its minimal sum-of-products expression is:\n\n- A) A'C'\n- B) C'\n- C) C\n- D) A' + C'\n\n**Q14.** *(U5)* Which statement about flip-flops is FALSE?\n\n- A) For an SR flip-flop, S = R = 1 is a forbidden input condition.\n- B) A D flip-flop transfers the value at D to Q on the active clock edge.\n- C) A T flip-flop with T = 0 toggles its output on every clock edge.\n- D) A JK flip-flop with J = K = 1 toggles on every active clock edge.\n\n**Q15.** *(U6)* A 4-bit Johnson (twisted-ring) counter has how many distinct states in its sequence?\n\n- A) 4\n- B) 8\n- C) 10\n- D) 16\n\n### Microprocessor and Computer Architecture (BIT151)\n\n**Q16.** *(U2)* Which statement about the 8085 interrupts is correct?\n\n- A) TRAP is non-maskable and has the highest priority.\n- B) RST 5.5 has a higher priority than RST 7.5.\n- C) INTR has the highest priority among the five interrupts.\n- D) The DI instruction also disables TRAP.\n\n**Q17.** *(U2)* How many bytes do the 8085 instructions MVI A, 32H;  LDA 2050H;  MOV A, B occupy, respectively?\n\n- A) 2, 2 and 1\n- B) 3, 3 and 1\n- C) 2, 3 and 2\n- D) 2, 3 and 1\n\n**Q18.** *(U8)* A 5-stage pipeline with a 2 ns clock cycle executes 100 instructions with no hazards. The total execution time is:\n\n- A) 200 ns\n- B) 208 ns\n- C) 210 ns\n- D) 1000 ns\n\n**Q19.** *(U5)* In Booth's algorithm, the multiplier bit pair (Q0, Q\u22121) = (1, 0) causes:\n\n- A) subtraction of the multiplicand from the partial product, then an arithmetic shift right\n- B) only an arithmetic shift right, with no addition or subtraction\n- C) subtraction of the multiplicand followed by a left shift\n- D) addition of the multiplicand to the partial product, then an arithmetic shift right\n\n**Q20.** *(U3)* Register A = 1100 and B = 1010. After the microoperation A \u2190 A \u2295 B, register A holds:\n\n- A) 0110\n- B) 1000\n- C) 0011\n- D) 1110\n\n### Object Oriented Programming, C++ (BIT153)\n\n**Q21.** *(U5)* What is the output?\n\n```cpp\nclass E { public: E() { cout << \"E\"; } ~E() { cout << \"e\"; } };\nclass C {\n    E m;\npublic:\n    C() { cout << \"C\"; }\n    ~C() { cout << \"c\"; }\n};\nint main() { C x; }\n```\n\n- A) CEce\n- B) CEec\n- C) ECce\n- D) ECec\n\n**Q22.** *(U2)* What happens when this program is compiled and run?\n\n```cpp\nvoid f(int a, int b = 2) { cout << a + b; }\nvoid f(int a)             { cout << a; }\nint main() { f(1); }\n```\n\n- A) Compile error: the call f(1) is ambiguous\n- B) It compiles and fails at run time\n- C) It prints 1\n- D) It prints 3\n\n**Q23.** *(U3)* What is the output?\n\n```cpp\nclass T {\npublic:\n    T()           { cout << \"D\"; }\n    T(const T &)  { cout << \"C\"; }\n};\nvoid show(T t) { }\nint main() { T a; show(a); T b = a; }\n```\n\n- A) DDC\n- B) DC\n- C) DCC\n- D) DCCC\n\n**Q24.** *(U4)* To convert an object of a user-defined class X into a basic type such as int, which mechanism is used?\n\n- A) It is impossible; only basic-to-user-defined conversion exists\n- B) A constructor of class X that takes an int argument\n- C) A conversion operator function, operator int(), defined in class X\n- D) A friend function that returns an int and is called automatically\n\n**Q25.** *(U6)* What is the output?\n\n```cpp\nclass B { public: void f() { cout << \"B\"; } virtual void g() { cout << \"B\"; } };\nclass D : public B { public: void f() { cout << \"D\"; } void g() { cout << \"D\"; } };\nint main() { B *p = new D; p->f(); p->g(); }\n```\n\n- A) DB\n- B) BD\n- C) DD\n- D) BB\n\n### Data Structures and Algorithms (BIT201)\n\n**Q26.** *(U3)* The postfix form of the infix expression  A * (B + C) / D  is:\n\n- A) A B C + * D /\n- B) A B * C + D /\n- C) A B C * + D /\n- D) A B C D + * /\n\n**Q27.** *(U3)* The value of the prefix expression  \u2212 * 2 3 + 4 1  is:\n\n- A) \u22121\n- B) 1\n- C) 5\n- D) 11\n\n**Q28.** *(U5)* Let fib(n) = n for n \u2264 1, else fib(n\u22121) + fib(n\u22122). Counting the initial call, how many calls are made to evaluate fib(4)?\n\n- A) 5\n- B) 8\n- C) 9\n- D) 15\n\n**Q29.** *(U7)* Keys 45, 25, 65, 15, 35, 55, 75 are inserted in this order into an empty BST. The node 25 (two children) is deleted by replacing it with its IN-ORDER SUCCESSOR. The pre-order traversal afterwards is:\n\n- A) 45, 35, 15, 65, 75, 55\n- B) 15, 35, 45, 55, 65, 75\n- C) 45, 35, 15, 65, 55, 75\n- D) 45, 15, 35, 65, 55, 75\n\n**Q30.** *(U8)* The array {4, 3, 2, 1} is sorted ascending by selection sort. Counting only exchanges between two different positions, the number of swaps is:\n\n- A) 2\n- B) 3\n- C) 4\n- D) 6\n\n**Q31.** *(U10)* A weighted undirected graph has edges AB = 4, AC = 2, BC = 1, BD = 5, CD = 8. The total weight of its minimum spanning tree is:\n\n- A) 7\n- B) 8\n- C) 11\n- D) 12\n\n### Database Management System (BIT202)\n\n**Q32.** *(U5)* R(A, B, C, D) has candidate key AB with functional dependencies AB \u2192 CD and B \u2192 C. The highest normal form R satisfies is:\n\n- A) 3NF\n- B) BCNF\n- C) 2NF\n- D) 1NF\n\n**Q33.** *(U5)* R(S, C, T) has the functional dependencies SC \u2192 T and T \u2192 C. The highest normal form R satisfies is:\n\n- A) BCNF\n- B) 3NF\n- C) 2NF\n- D) 1NF\n\n**Q34.** *(U4)* Which of the following SQL statements is INVALID?\n\n- A) SELECT dept, AVG(sal) FROM emp GROUP BY dept;\n- B) SELECT dept FROM emp GROUP BY dept HAVING COUNT(*) > 2;\n- C) SELECT dept FROM emp WHERE COUNT(*) > 2 GROUP BY dept;\n- D) SELECT COUNT(*) FROM emp WHERE sal > 1000;\n\n**Q35.** *(U4)* Which of the following SQL statements change the structure (schema) of a table, rather than just its rows?\n\n- A) ALTER TABLE\n- B) DROP TABLE\n- C) UPDATE\n- D) Both a and b\n\n**Q36.** *(U7)* Which statement about the deferred-update recovery technique is correct?\n\n- A) Neither UNDO nor REDO is ever needed.\n- B) Updates reach the database before commit, so UNDO is required.\n- C) It switches between old and new versions using a shadow page table.\n- D) Uncommitted transactions never need UNDO, but committed ones may need REDO after a crash.\n\n### Operating Systems (BIT204)\n\n**Q37.** *(U3)* Processes arrive as P1 (t = 0, burst 7), P2 (t = 2, burst 4), P3 (t = 4, burst 1), P4 (t = 5, burst 4). The average waiting time under preemptive Shortest Remaining Time First is:\n\n- A) 2.5 ms\n- B) 3 ms\n- C) 4 ms\n- D) 4.75 ms\n\n**Q38.** *(U4)* For the reference string 1 2 3 4 1 2 5 1 2 3 4 5 with FIFO replacement, the numbers of page faults with 3 frames and with 4 frames are, respectively:\n\n- A) 9 and 9\n- B) 10 and 9\n- C) 8 and 10\n- D) 9 and 10\n\n**Q39.** *(U4)* A process has a 32 KB logical address space. Physical memory is 64 KB and the page size is 2 KB. The process's page table has how many entries, and how many bits are needed for a frame number?\n\n- A) 32 entries and 5 bits\n- B) 32 entries and 4 bits\n- C) 16 entries and 4 bits\n- D) 16 entries and 5 bits\n\n**Q40.** *(U3)* Four processes share identical units of one resource. Each process needs at most 3 units and requests them one at a time. What is the minimum number of units that guarantees deadlock cannot occur?\n\n- A) 4\n- B) 8\n- C) 9\n- D) 12\n\n**Q41.** *(U5)* The disk head is at cylinder 50 (cylinders 0\u2013199). Pending requests: 82, 170, 43, 140, 24, 16, 190. The total head movement under SSTF scheduling is:\n\n- A) 208 cylinders\n- B) 314 cylinders\n- C) 332 cylinders\n- D) 642 cylinders\n\n**Q42.** *(U4)* Which statement correctly contrasts paging and segmentation?\n\n- A) Paging uses fixed-size pages and causes internal fragmentation; segmentation uses variable-size logical segments and can cause external fragmentation.\n- B) Both use fixed-size blocks, so both suffer only from internal fragmentation.\n- C) Paging is visible to the programmer; segmentation is invisible to the programmer.\n- D) Paging uses variable-size units and causes external fragmentation; segmentation uses fixed-size units and causes internal fragmentation.\n\n### Web Technology (BIT251 & BIT301)\n\n**Q43.** *(U2)* Which of the following is NOT a valid HTML5 semantic element?\n\n- A) <aside>\n- B) <section>\n- C) <figure>\n- D) <content>\n\n**Q44.** *(U3)* An element's property is set by an inline style attribute, an internal <style> rule and an external stylesheet rule, all with equal specificity otherwise. Which declaration is applied?\n\n- A) The browser ignores all three\n- B) The inline style\n- C) The internal <style> rule\n- D) The external stylesheet rule\n\n**Q45.** *(U4)* Which statement about JavaScript popup boxes is correct?\n\n- A) confirm() returns the string typed by the user.\n- B) prompt() returns the text entered by the user, or null if Cancel is clicked.\n- C) alert() returns true or false depending on the button clicked.\n- D) prompt() shows only an OK button.\n\n**Q46.** *(U5)* Which statement about XML schema languages is correct?\n\n- A) XQuery is a schema language written in XML.\n- B) XSLT is used to define the permitted structure of an XML document.\n- C) XSD is itself written in XML and supports data types such as integer and date.\n- D) DTD supports data types such as integer and date, but XSD does not.\n\n**Q47.** *(U8)* What does this PHP code print?\n\n```php\n$a = \"5\";\n$b = $a + 3;\n$c = $a . \"3\";\necho $b . \",\" . $c;\n```\n\n- A) 8,53\n- B) 8,8\n- C) 53,8\n- D) 53,53\n\n### Systems Analysis and Design (BIT253)\n\n**Q48.** *(U2)* Which type of feasibility study asks whether the system can be completed within the available time?\n\n- A) Technical feasibility\n- B) Operational feasibility\n- C) Economic feasibility\n- D) Schedule feasibility\n\n**Q49.** *(U3)* Which of the following is a RADICAL method of determining system requirements?\n\n- A) Business process reengineering\n- B) Joint application design\n- C) Observation\n- D) Interviews\n\n**Q50.** *(U3)* A context diagram in a data flow diagram set:\n\n- A) decomposes one process into sub-processes\n- B) shows the time-ordered messages between objects\n- C) shows the whole system as a single process together with its external entities and data flows\n- D) shows every process and every data store of the system\n\n**Q51.** *(U5)* A package is released to a selected group of real customers who use it in their own environment with real data to report faults before general release. This is:\n\n- A) Regression testing\n- B) Beta testing\n- C) Alpha testing\n- D) Unit testing\n\n**Q52.** *(U4)* In an ER-to-relation transformation, a one-to-many relationship between DEPARTMENT (one) and EMPLOYEE (many) is represented by:\n\n- A) placing EMPLOYEE's primary key in DEPARTMENT as a foreign key\n- B) merging both entities into one relation with a repeating group\n- C) placing DEPARTMENT's primary key in EMPLOYEE as a foreign key\n- D) creating a new relation containing both primary keys\n\n### Network and Data Communications (BIT254)\n\n**Q53.** *(U4)* The network address of the host 192.168.10.77/27 is:\n\n- A) 192.168.10.32\n- B) 192.168.10.72\n- C) 192.168.10.96\n- D) 192.168.10.64\n\n**Q54.** *(U3)* In Selective Repeat ARQ with 3-bit sequence numbers, the maximum send window size is:\n\n- A) 3\n- B) 4\n- C) 7\n- D) 8\n\n**Q55.** *(U4)* Which statement about distance-vector routing is correct?\n\n- A) Each packet is copied to all outgoing lines.\n- B) OSPF is a typical distance-vector protocol.\n- C) Each router periodically shares its routing table with its directly connected neighbours.\n- D) Each router builds a complete map of the network and runs Dijkstra's algorithm.\n\n**Q56.** *(U6)* Which protocol\u2013function pair is INCORRECT?\n\n- A) SMTP \u2013 sending e-mail\n- B   if(locked)return;if(MK){MK.a[byN(Q[P]).n]=i;next();return}locked=true;const q=byN(Q[P]),k=q._k||q.n,ok=i===q.a,lk=ok&&CF===1,bs=[...document.querySelectorAll('.opt')];
  bs.forEach(b=>b.disabled=true);$('#skip').disabled=true;
  REC={k:qk(q),t:Date.now(),s:cl(q.s),u:q.u||'',q:q.q.slice(0,120),ch:i,ok,cf:CF,sec:Math.round((Date.now()-T0)/1000),lk,set:S};L.push(REC);try{sr(q,ok&&!lk)}catch(e){try{sr(q,ok)}catch(e){}}
  if(ok){if(q._k)mark(q._k,1,i);else{R[q.n]='c';delete W[q.n]}bs[i].classList.add('ok');
    if(lk)$('#fb').innerHTML='<div class="exp" style="background:var(--skb);border-color:var(--sk)"><b class="c-sk">Lucky guess.</b> Right, but it comes back tomorrow as if missed.</div>';
    save();setTimeout(()=>{if(view==='q'&&Q[P]===k)next()},lk?1600:700)}
  else{if(q._k)mark(q._k,0,i);else{R[q.n]='w';W[q.n]=i}bs[i].classList.add('no');bs[q.a].classList.add('ok');
    if(!RA.has(k)){RA.add(k);Q.splice(Math.min(Q.length,P+6+(Math.random()*5|0)),0,k)}save();
    $('#fb').innerHTML=`<div class="exp"><b class="c-no">Wrong.</b> Correct: <b>${'ABCD'[q.a]}</b>. ${esc(q.e)}</div><p class="mu" style="margin:10px 0 4px">What kind of error was it? (optional, Continue skips it)</p>
    <div class="row">${['Knowledge gap','Conceptual','Confusion','Careless'].map((n,x)=>`<button class="et" onclick="setEt(${x})">${n}</button>`).join('')}</div><div id="ex" class="mu"></div>
    <input type="text" id="fx" placeholder="Optional one-line fix: X is wrong because it is actually Y" onkeydown="if(event.key==='Enter')fin()">
    <p class="row"><button class="p" id="nx" onclick="fin()">Continue →</button></p>`}
}
function setEt(x){ET=x;document.querySelectorAll('.et').forEach((b,i)=>b.classList.toggle('on',i===x));const q=byN(Q[P]);
  $('#ex').innerHTML=[`Source: ${esc(q.u||q.s)} — re-read that point, then write the fix.`,'Relearn the why, not just the answer. It will be queued for teach-back if repeated.','<input type="text" id="cw" placeholder="I mixed up ___ with ___">',`<select id="cs"><option>misread NOT/EXCEPT/FALSE</option><option>calculation slip</option><option>changed a right answer</option><option>rushed</option></select> <span>No chapter re-read needed.</span>`][x]}
function fin(sk){
  const f=($('#fx')||{}).value||'';REC.et=ET<0?'':['Knowledge gap','Conceptual','Confusion','Careless'][ET]+(ET===3&&$('#cs')?': '+$('#cs').value:'');if($('#cw'))REC.cw=$('#cw').value;REC.fix=sk?'':f.trim();REC.unfixed=!REC.fix;save();next()}
function skip(){if(locked)return;if(MK){next();return}const q=byN(Q[P]);if(q._k){save();next();return}if(R[q.n]!=='w'){R[q.n]='s';try{sr(q,false)}catch(e){} }save();next()}
function genVariant(){
  if(genInProgress)return;const q=byN(Q[P]);if(!q)return;const now=Date.now();if(now-gemLast<GEM_COOLDOWN_MS){alert('Cooldown: wait a few seconds before generating another variant.');return}if(gemVarsUsed>=GEM_MAX_VARS){alert('Max AI variants reached for this session.');return}if(!GEM_KEY){alert('Add Gemini API key in Settings first.');return}
  genInProgress=true;const b=$('#genv');if(b){b.disabled=true;b.textContent='Generating...';}
  const isMath=(q.t&&(q.t.indexOf('T')>=0||q.t.indexOf('C')>=0))||(q.code&&q.code.length>0)||/math|stat|calcu/.test((q.s||'').toLowerCase());
  const sysGen=isMath?MATH_PROMPT:GEN_PROMPT;
  const source={subject:q.s,unit:q.u||'',tag:q.t||'',stem:q.q,code:q.code||[],options:q.o,answer:q.a,why:q.e||''};
  const schema={type:'object',properties:{subject:{type:'string'},unit:{type:'string'},tag:{type:'string'},stem:{type:'string'},code:{type:'array',items:{type:'string'}},options:{type:'array',items:{type:'string'}},answer:{type:'integer'},why:{type:'string'}},required:['subject','unit','tag','stem','code','options','answer','why']};
  const body={input:sysGen+'\n\nCreate one new question variant from this source question:\n'+JSON.stringify(source),response_format:{type:'text',mime_type:'application/json',schema},store:false};
  const requestModel=async model=>{
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/interactions',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':GEM_KEY},body:JSON.stringify({...body,model})});
    const raw=await r.text();let j;try{j=raw?JSON.parse(raw):{}}catch(e){throw new Error('Gemini returned an unreadable response (HTTP '+r.status+').')}
    if(!r.ok){const e=new Error((j.error&&j.error.message)||('Gemini API request failed (HTTP '+r.status+').'));e.status=r.status;throw e;}
    const txt=j.output_text||(j.steps||[]).filter(s=>s.type==='model_output').flatMap(s=>s.content||[]).filter(c=>c.type==='text').map(c=>c.text||'').join('\n');
    if(!txt)throw new Error('Gemini returned no text. Check the model response and try again.');
    return{txt,model};
  };
  const generate=async()=>{
    let lastError;
    for(const model of [GEM_MODEL,'gemini-3.6-flash','gemini-3.5-flash-lite']){
      try{return await requestModel(model)}catch(e){
        lastError=e;
        if(![404,429,500,502,503,504].includes(e.status))throw e;
      }
    }
    throw lastError||new Error('No Gemini model is currently available.');
  };
  generate().then(({txt,model})=>{
    let v;try{v=JSON.parse(txt)}catch(e){throw new Error('Gemini response was not valid JSON. Try generating again.')}
    if(!v||typeof v.stem!=='string'||!v.stem.trim()||!Array.isArray(v.options)||v.options.length!==4||v.options.some(o=>typeof o!=='string'||!o.trim())||!Number.isInteger(v.answer)||v.answer<0||v.answer>3){throw new Error('Gemini returned an invalid question: expected a stem, four options, and answer index 0-3.');}
    v.code=v.code||[];if(q.code.length&&v.code.length===0)v.code=q.code.map(x=>x);
    const sameStem=(String(v.stem||'').trim().toLowerCase())===(String(q.q||'').trim().toLowerCase());
    const dupOpt=new Set(v.options.map(x=>(String(x)||'').trim().toLowerCase())).size<4;
    if(sameStem||dupOpt)throw new Error('Variant rejected (duplicate content)');
    const vq={n:gemVars.length,id:undefined,s:v.subject||q.s,u:v.unit||q.u||'',t:v.tag||q.t||'',q:String(v.stem),code:Array.isArray(v.code)?v.code.map(String):[],o:v.options.map(String),a:v.answer,e:(v.why?String(v.why):''),_ai:true,_srcKey:qk(q),_srcN:q.n,_verified:false,_reject:null};
    gemVars.push(vq);gemVarsUsed++;gemLast=Date.now();
    if(b){b.disabled=false;b.textContent='✨ Make similar variant';}
    genInProgress=false;alert('AI variant added ('+(gemVars.length)+' total).'+(model!==GEM_MODEL?' Backup model used: '+model+'.':''));
  }).catch(e=>{
    if(b){b.disabled=false;b.textContent='✨ Make similar variant';}genInProgress=false;alert('Variant generation failed: '+(e.message||'error'));
  });
}
const GEN_PROMPT='You are an expert MCQ item writer. Rewrite to test the IDENTICAL concept/outcome with different surface. Solve first, exactly 4 options A-D, one unambiguous answer. No verbatim copy. Return ONLY valid JSON: {"subject":"string","unit":"string|null","tag":"string|null","stem":"string","code":[],"options":["a","b","c","d"],"answer":0,"why":"string"}';
const MATH_PROMPT='Solve ORIGINAL step by step, create VARIANT with DIFFERENT numbers/variables preserving method, solve VARIANT independently, 4 options with plausible slips, one answer. Return ONLY JSON: {"subject":"string","unit":"string|null","tag":"string|null","stem":"string","code":["string"],"options":["a","b","c","d"],"answer":0,"why":"string"}';
function startGem(){if(!gemVars.length)return;start(gemVars.map((_,i)=>'v:'+i));}
function next(){P++;save();show()}
function done(){
  view='done';let RM='';if(REV!==null&&A[REV]){const v=A[REV].rv||{n:0};A[REV].rv={n:v.n+1,d:new Date().toISOString()};RM=`<p class="c-ok"><b>Set ${A[REV].no} marked as revised (${A[REV].rv.n}×).</b></p>`}REV=null;save();const r=Q.map(n=>typeof n==='string'?(A[n.split(':')[0]].errs[n.split(':')[1]].fx?'c':'w'):R[n]);
  $('#app').innerHTML=`<h1>Session complete 🎉</h1>${RM}<div class="card"><div class="row">${stats()}</div>
  <p>This session (${Q.length} questions): <b class="c-ok">${r.filter(x=>x==='c').length} correct</b>, <b class="c-no">${r.filter(x=>x==='w').length} wrong</b>, <b class="c-sk">${r.filter(x=>x==='s').length} skipped</b>.</p>
  <button class="p" onclick="home()">Back to menu</button></div>`;
}
document.addEventListener('keydown',e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(view!=='q'||e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
  if(!locked){if(k==='z'){cycleCf();return}const i='abcd'.indexOf(k),j='1234'.indexOf(k);if(i>=0)pick(i);else if(j>=0)pick(j);else if(k==='s')skip()}
  else if((k==='enter'||k===' ')&&$('#nx')){e.preventDefault();next()}
});
function openSettings(){
  const m=`<h1>⚙ Settings</h1><div class="card">
  <p class="mu">Gemini 3.8 Flash is tried first for similar-question variants, then Gemini 3.6 Flash and Gemini 3.5 Flash-Lite if the service is busy, rate-limited, or the model is unavailable. Free-tier quota and model access depend on your AI Studio project; check its current limits before use.</p>
  <p class="mu">With unpaid Gemini API use, Google may use submitted prompts and responses to improve its services, and human reviewers may process them. Do not send personal or sensitive information. Your API key is saved in this browser and is not safe to expose in a publicly hosted app.</p>
  <label class="mu">Gemini API key</label><input type="password" id="gk" value="${esc(GEM_KEY)}" placeholder="Paste AI Studio key">
  <label class="mu" style="margin-top:8px;display:block">Model</label>
  <select id="gm"><option value="gemini-3.8-flash" selected>gemini-3.8-flash</option></select>
  <label class="mu" style="margin-top:8px;display:block">Cooldown (ms)</label><input type="number" id="gc" value="${GEM_COOLDOWN_MS}" min="1000" step="500">
  <label class="mu" style="margin-top:8px;display:block">Max AI variants per session</label><input type="number" id="gx" value="${GEM_MAX_VARS}" min="1" max="20">
  <p class="row" style="margin-top:12px"><button class="p" onclick="saveSettings()">Save</button><button onclick="home()">Close</button><button onclick="localStorage.removeItem('bitmcq_gem');GEM_KEY='';openSettings()">Clear API key</button></p>
  <p class="mu">AI variants are marked unverified and never auto-added to your main bank.</p>
  </div>`;
  $('#app').innerHTML=m;
}
function saveSettings(){
  GEM_KEY=$('#gk').value.trim();GEM_MODEL='gemini-3.8-flash';GEM_COOLDOWN_MS=+$('#gc').value||8000;GEM_MAX_VARS=+$('#gx').value||10;
  localStorage.setItem('bitmcq_gem',GEM_KEY);localStorage.setItem('bitmcq_gem_m',GEM_MODEL);home();
}
load();home();
</script></body></html>
